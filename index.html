  function pousser(E){ if(E.n===undefined) E.n=C.niv; C.el.push(E); CRE.hist.push({a:"ajout"}); }
  function supprimer(i){
    var E=C.el[i]; C.el.splice(i,1); CRE.hist.push({a:"suppr", i:i, E:E});
  }
  function annuler(){
    var h=CRE.hist.pop();
    if(!h){ toast("Rien à annuler","att"); return; }
    if(h.a==="ajout") C.el.pop();
    else if(h.a==="sommet") retirerSommet(h.E, h.k);
    else C.el.splice(h.i,0,h.E);
    CRE.sel=null; sauver(); peindre();
  }
  CRE.peindre=peindre; CRE.annuler=annuler; CRE.pousser=pousser;

  /* --- pointeurs --- */
  var actif=null;
  cv.addEventListener("pointerdown", function(e){
    if(e.pointerType==="pen") CRE.dernierPen=Date.now();
    if(e.pointerType==="touch"){
      CRE.touches[e.pointerId]=ecran(e);
      if(nbTouches()>=2){
        annulerTrace();
        CRE.pinch=null;
        return;
      }
      if(cfg.stylet!=="doigt" && Date.now()-CRE.dernierPen < 1800) return;
    }
    if(actif!==null) return;
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    actif=e.pointerId;
    var p=pos(e);
    var gomme = CRE.outil==="gomme" || (e.pointerType==="pen" && (e.buttons & 32));
    if(gomme){
      var k=elementSous(C,p.x,p.y);
      if(k!==null){
        if(C.el[k].t==="piece"){
          toast("La gomme ne supprime pas une pièce — prends « Déplacer », sélectionne-la, puis « Supprimer »","att");
        } else { supprimer(k); CRE.sel=null; sauver(); peindre(); }
      }
      CRE.encours={mode:"gomme"};
      return;
    }
    if(CRE.outil==="main"){
      if(CRE.droit){
        var sp=snapPoint(C,p.x,p.y);
        CRE.encours={mode:"droit", E:{t:"main", c:CRE.couleur, e:CRE.epaisseur, droit:true,
                     p:[r3(sp.x),r3(sp.y),r3(sp.x),r3(sp.y)]}};
      } else {
        CRE.encours={mode:"main", E:{t:"main", c:CRE.couleur, e:CRE.epaisseur, p:[r3(p.x),r3(p.y)]}};
      }
      pousser(CRE.encours.E);
    } else if(CRE.outil==="cote"||CRE.outil==="echelle"){
      CRE.encours={mode:"seg", E:{t:CRE.outil==="echelle"?"echelle":"cote", x1:r3(p.x),y1:r3(p.y),x2:r3(p.x),y2:r3(p.y), m:null}};
      pousser(CRE.encours.E);
    } else if(CRE.outil==="liaison"){
      var der=null;
      for(var i=C.el.length-1;i>=0;i--) if(C.el[i].t==="liaison" && C.el[i].ouvert){ der=C.el[i]; break; }
      if(der){ der.p.push(r3(p.x), r3(p.y)); der.dz=der.dz||[0]; der.dz.push(0); der.dn=der.dn||[0]; der.dn.push(0); }
      else { var L={t:"liaison", res:CRE.res||"frigo", dim:"", p:[r3(p.x),r3(p.y)], dz:[0], dn:[0], seg:[], ouvert:true}; pousser(L); }
      sauver(); peindre();
      CRE.encours={mode:"clic"};
    } else if(CRE.outil==="sym"){
      var E={t:"sym", s:CRE.sym, x:r3(p.x), y:r3(p.y), r:0, e:CRE.taille||0.055, txt:""};
      pousser(E);
      CRE.sel=C.el.length-1;
      sauver(); peindre();
      if(CRE.sym==="perc"){
        demanderTexte("Diamètre du percement","En millimètres. Ça alimente les postes de carottage.","", "number", function(v){
          if(v!==null) E.txt=String(v).replace(",",".");
          sauver(); peindre();
        });
      }
      CRE.encours={mode:"deplacer", i:C.el.length-1, dx:0, dy:0};
    } else if(CRE.outil==="chemin"){
      if(!CRE.chemin){ toast("Choisis d'abord comment ça passe","att"); CRE.encours={mode:"clic"}; return; }
      var sy=symSous(C,p.x,p.y);
      var px=sy?sy.x:p.x, py=sy?sy.y:p.y;
      if(!CRE.chemin.a){
        CRE.chemin.a={x:px, y:py};
        toast(sy ? "Départ sur « "+symDef(sy.s).l+" » — appuie maintenant sur l'arrivée"
                 : "Départ posé — appuie sur l'arrivée","ok");
        CRE.encours={mode:"clic"};
        peindre();
        return;
      }
      var A=CRE.chemin.a;
      var ch=cheminer(C, A.x, A.y, px, py, CRE.chemin.mode);
      ch.dz[0]=CRE.chemin.depart||0;
      ch.dz[ch.dz.length-1]=CRE.chemin.arrivee||0;
      var dnv=[]; for(var iz=0;iz<ch.dz.length;iz++) dnv.push(0);
      var LN={t:"liaison", res:CRE.res||"frigo", dim:"", p:ch.p, dz:ch.dz, dn:dnv, seg:[],
              passage:CRE.chemin.mode, ouvert:false};
      pousser(LN);
      CRE.chemin.a=null;
      CRE.sel=C.el.length-1; CRE.somm=null;
      sauver(); peindre();
      var LL=longueurLiaison(C,LN);
      toast(LL.total!==null ? fmt(LL.total,1)+" m proposés — tire sur les points pour corriger"
                            : "Cheminement proposé — tire sur les points pour corriger", "ok");
      CRE.encours={mode:"clic"};
    } else if(CRE.outil==="denivele"){
      var pt=pointLiaisonSous(C,p.x,p.y);
      if(!pt){ toast("Appuie sur un point de la liaison","att"); CRE.encours={mode:"clic"}; return; }
      pt.E.dz=pt.E.dz||[];
      while(pt.E.dz.length < pt.E.p.length/2) pt.E.dz.push(0);
      pt.E.dn=pt.E.dn||[];
      while(pt.E.dn.length < pt.E.p.length/2) pt.E.dn.push(0);
      demanderDenivele(pt.E.dz[pt.k], nb(hspMoyenne())||2.5, function(v, dn){
        if(v===null) return;
        pt.E.dz[pt.k]=v;
        pt.E.dn[pt.k]=dn||0;
        sauver(); peindre();
        if(v) toast("Dénivelé de "+fmt(Math.abs(v),1)+" m ajouté au métré"+
                    (dn ? " — le tracé passe au "+NIVEAUX[Math.max(0,Math.min(NIVEAUX.length-1,nivSegment(pt.E,pt.k)))] : ""),"ok");
      }, pt.E.dn[pt.k]);
      CRE.encours={mode:"clic"};
    } else if(CRE.outil==="texte"){
      demanderTexte("Texte à poser","", "", "text", function(v){
        if(v===null||!txt(v)) return;
        pousser({t:"texte", x:r3(p.x), y:r3(p.y), txt:v, c:CRE.couleur});
        sauver(); peindre();
      });
      CRE.encours={mode:"clic"};
    } else if(CRE.outil==="deplacer"){
      var som=sommetSous(C,p.x,p.y);
      if(som){
        CRE.sel=som.i; CRE.somm={E:som.E, k:som.k};
        CRE.encours={mode:"sommet", E:som.E, k:som.k};
        peindre();
        return;
      }
      var seg=segmentSous(C,p.x,p.y);
      if(seg){
        var nk=insererSommet(seg.E, seg.k, p.x, p.y);
        CRE.sel=seg.i; CRE.somm={E:seg.E, k:nk};
        CRE.encours={mode:"sommet", E:seg.E, k:nk};
        CRE.hist.push({a:"sommet", E:seg.E, k:nk});
        sauver(); peindre();
        return;
      }
      CRE.somm=null;
      var k2=elementSous(C,p.x,p.y,0.05,true);
      CRE.sel=k2;
      if(k2!==null){
        var E2=C.el[k2];
        CRE.encours={mode:"deplacer", i:k2,
          dx:(E2.x!==undefined?p.x-E2.x:0), dy:(E2.y!==undefined?p.y-E2.y:0),
          ox:p.x, oy:p.y,
          suite: E2.t==="piece" ? contenuDeRect(C, E2) : null};
        if(CRE.encours.suite && CRE.encours.suite.length)
          toast(CRE.encours.suite.length+" élément"+(CRE.encours.suite.length>1?"s":"")+" suivent la pièce","ok");
      } else CRE.encours={mode:"clic"};
      peindre();
    }
  }, false);

  cv.addEventListener("pointermove", function(e){
    if(e.pointerType==="touch" && CRE.touches[e.pointerId]){
      CRE.touches[e.pointerId]=ecran(e);
      if(nbTouches()>=2){ e.preventDefault(); majPinch(); return; }
    }
    if(e.pointerId!==actif || !CRE.encours) return;
    if(e.pointerType==="pen") CRE.dernierPen=Date.now();
    e.preventDefault();
    var p=pos(e), m=CRE.encours;
    if(m.mode==="main"){
      var pts=m.E.p, n=pts.length;
      if(Math.abs(p.x-pts[n-2])+Math.abs(p.y-pts[n-1]) < 0.004) return;
      pts.push(r3(p.x), r3(p.y));
      ctx.strokeStyle=m.E.c; ctx.lineWidth=m.E.e*CRE.W/1000*2.2;
      ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath(); ctx.moveTo(pts[n-2]*CRE.W, pts[n-1]*CRE.W);
      ctx.lineTo(p.x*CRE.W, p.y*CRE.W); ctx.stroke();
    } else if(m.mode==="droit"){
      var q=calerAngle(m.E.p[0], m.E.p[1], p.x, p.y);
      var sp2=snapPoint(C, q.x, q.y);
      m.E.p[2]=r3(sp2.x); m.E.p[3]=r3(sp2.y);
      peindre();
    } else if(m.mode==="seg"){
      var q2=calerAngle(m.E.x1, m.E.y1, p.x, p.y);
      var sp3=snapPoint(C, q2.x, q2.y);
      m.E.x2=r3(sp3.x); m.E.y2=r3(sp3.y); peindre();
    } else if(m.mode==="gomme"){
      var k=elementSous(C,p.x,p.y);
      if(k!==null && C.el[k].t!=="piece"){ supprimer(k); peindre(); }
    } else if(m.mode==="sommet"){
      var tab = (m.E.t==="piece") ? m.E.poly : m.E.p;
      if(!tab) return;
      var pt2=p;
      if(CRE.droit && m.k>0){
        pt2=calerAngle(tab[(m.k-1)*2], tab[(m.k-1)*2+1], p.x, p.y);
      }
      var sn=snapPoint(C, pt2.x, pt2.y, 0.014);
      tab[m.k*2]=r3(sn.x); tab[m.k*2+1]=r3(sn.y);
      majBoite(m.E);
      peindre();
    } else if(m.mode==="deplacer" && m.i!==null){
      var E=C.el[m.i];
      if(m.suite && m.suite.length && E.t==="piece"){
        var ddx0=r3(p.x-m.dx)-E.x, ddy0=r3(p.y-m.dy)-E.y;
        m.suite.forEach(function(S){ decalerElement(S, ddx0, ddy0); });
      }
      if(E.t==="piece" && E.poly){
        var ax=r3(p.x-m.dx)-E.x, ay=r3(p.y-m.dy)-E.y;
        for(var qq=0;qq<E.poly.length;qq+=2){ E.poly[qq]=r3(E.poly[qq]+ax); E.poly[qq+1]=r3(E.poly[qq+1]+ay); }
        E.x=r3(E.x+ax); E.y=r3(E.y+ay);
      }
      else if(E.x!==undefined){ E.x=r3(p.x-m.dx); E.y=r3(p.y-m.dy); }
      else if(E.p){
        var ddx=p.x-m.ox, ddy=p.y-m.oy;
        for(var i=0;i<E.p.length;i+=2){ E.p[i]=r3(E.p[i]+ddx); E.p[i+1]=r3(E.p[i+1]+ddy); }
        m.ox=p.x; m.oy=p.y;
      } else if(E.x1!==undefined){
        var dx2=p.x-m.ox, dy2=p.y-m.oy;
        E.x1=r3(E.x1+dx2); E.x2=r3(E.x2+dx2); E.y1=r3(E.y1+dy2); E.y2=r3(E.y2+dy2);
        m.ox=p.x; m.oy=p.y;
      }
      peindre();
    }
  }, false);

  function finir(e){
    if(e.pointerType==="touch"){
      delete CRE.touches[e.pointerId];
      if(nbTouches()<2) CRE.pinch=null;
    }
    if(e.pointerId!==actif) return;
    actif=null;
    var m=CRE.encours; CRE.encours=null;
    if(!m) return;
    if(m.mode==="droit"){
      var ln0=Math.sqrt(Math.pow(m.E.p[2]-m.E.p[0],2)+Math.pow(m.E.p[3]-m.E.p[1],2));
      if(ln0<0.012){ var ix=C.el.indexOf(m.E); if(ix>=0){ C.el.splice(ix,1); CRE.hist.pop(); } sauver(); peindre(); return; }
      sauver(); peindre();
      if(CRE.clavier) demanderCote(C, m.E, function(){ sauver(); peindre(); });
      return;
    }
    if(m.mode==="seg"){
      var E=m.E, ln=longueurNorm(E);
      if(ln<0.02){ var i=C.el.indexOf(E); if(i>=0){ C.el.splice(i,1); CRE.hist.pop(); } sauver(); peindre(); return; }
      if(E.t==="echelle"){
        demanderTexte("Longueur réelle de ce trait","En mètres. Toutes les cotes suivantes s'en déduisent.","", "number", function(v){
          var n=v===null?null:parseFloat(String(v).replace(",","."));
          if(n && n>0){ C.ech={px:ln, m:n}; toast("Échelle posée","ok"); }
          var k=C.el.indexOf(E); if(k>=0){ C.el.splice(k,1); CRE.hist.pop(); }
          sauver(); peindre(); outilChoisi("main");
        });
        return;
      }
      var auto=metres(C,ln);
      if(auto!==null){ E.m=Math.round(auto*100)/100; sauver(); peindre(); return; }
      demanderTexte("Longueur de cette cote","En mètres.","", "number", function(v){
        var n=v===null?null:parseFloat(String(v).replace(",","."));
        if(n && n>0){ E.m=n; if(!C.ech) C.ech={px:ln, m:n}; }
        sauver(); peindre();
      });
      return;
    }
    sauver(); peindre();
  }
  cv.addEventListener("pointerup", finir, false);
  cv.addEventListener("pointercancel", finir, false);

  /* --- barre d'outils --- */
  function outilChoisi(k){
    CRE.outil=k;
    if(k!=="sym") palette.style.display="none";
    CRE.sel=null;
    Array.prototype.forEach.call(bas.querySelectorAll("button[data-o]"), function(b){
      b.className = "crb"+(b.dataset.o===k ? " on" : "");
    });
    peindre();
  }
  function outil(k, lib){
    var b=el("button","crb",lib); b.type="button"; b.dataset.o=k;
    b.onclick=function(){
      if(k==="sym"){ palette.style.display = (palette.style.display==="none") ? "flex" : "none"; }
      if(k==="liaison"){ C.el.forEach(function(E){ if(E.t==="liaison") E.ouvert=false; }); }
      if(k==="chemin"){
        C.el.forEach(function(E){ if(E.t==="liaison") E.ouvert=false; });
        demanderPassage(nb(hspMoyenne())||2.5, CRE.chemin?CRE.chemin.mode:null, function(r){
          if(!r){ outilChoisi("main"); return; }
          CRE.chemin={mode:r.mode, depart:r.depart, arrivee:r.arrivee, a:null};
          outilChoisi("chemin");
          toast("Appuie sur le départ, puis sur l'arrivée","ok");
        });
        return;
      }
      if(k==="echelle" && C.ech){
        dialogueEchelle(C, function(){ outilChoisi("echelle"); toast("Trace un trait sur une longueur connue","ok"); },
                        function(){ sauver(); peindre(); outilChoisi("main"); });
        return;
      }
      outilChoisi(k);
    };
    bas.appendChild(b);
    return b;
  }

  bDeg.onclick=function(){
    var anciens=[];
    C.el.forEach(function(E){ if(E.t==="piece" && E.deduit && nivDe(E)===C.niv) anciens.push(E); });
    if(anciens.length){
      var reste=[];
      C.el.forEach(function(E){
        for(var q=0;q<anciens.length;q++) if(anciens[q]===E) return;
        reste.push(E);
      });
      C.el=reste;
    }
    var r=deduireDegagement(C);
    if(r.erreur){ toast(r.erreur,"att"); sauver(); peindre(); return; }
    var n=0, mtot=0;
    r.zones.forEach(function(z, idx){
      var E={t:"piece", n:C.niv, deduit:true, poly:z.poly,
             nom: r.zones.length>1 ? "Dégagement "+(idx+1) : "Dégagement", info:""};
      majBoite(E);
      var sm=surfacePoly(C,E);
      if(sm!==null){ E.info=fmt(sm,1)+" m²"; mtot+=sm; }
      C.el.push(E); n++;
    });
    CRE.hist=[];
    sauver(); peindre();
    var msg=n+" dégagement"+(n>1?"s":"")+" déduit"+(n>1?"s":"")+
      (mtot? " — "+fmt(mtot,1)+" m² au total" : "");
    var sh=nb(V.maison.surface);
    if(sh!==null){
      var sp=0;
      C.el.forEach(function(E){
        if(E.t!=="piece" || nivDe(E)!==C.niv) return;
        var sm2=surfacePoly(C,E);
        if(sm2!==null) sp+=sm2;
      });
      var reste=sh-sp;
      if(Math.abs(reste) > sh*0.12)
        msg += " · le plan couvre "+fmt(sp,0)+" m² sur les "+fmt(sh,0)+" annoncés"+
               (reste>0 ? ", il manque "+fmt(reste,0)+" m²" : "");
    }
    toast(msg+". Tire sur les coins pour ajuster.","ok");
  };

function r3(v){ return Math.round(v*1000)/1000; }

/* Le croquis d'une piece arrive deja trace a ses cotes : il n'y a plus qu'a poser
   les portes, les fenetres et les equipements dessus. */
function croquisPiece(P, idx){
  var l=nb(P.lg), la=nb(P.la), sp=surfacePiece(P);
  if(l===null||la===null){
    if(sp===null) return croquisVierge((txt(P.nom)||"Pièce")+" — croquis");
    l=Math.sqrt(sp*1.3); la=sp/l;
  }
  var C=croquisVierge(txt(P.nom)||("Pièce "+(idx+1)));
  var marge=0.13;
  var ech=Math.min((1-2*marge)/l, (1.3-2*marge)/la);
  var h=la*ech;
  C.ratio=Math.max(0.55, Math.min(1.4, h+2*marge));
  var y0=(C.ratio-h)/2;
  C.niv=nivIndex(P.niveau);
  C.piece=P.pid;
  C.ech={px:l*ech, m:l};
  C.el.push({t:"piece", n:C.niv, x:r3(marge), y:r3(y0), w:r3(l*ech), h:r3(h),
             nom:txt(P.nom)||("Pièce "+(idx+1)), info:fmt(l,2)+" × "+fmt(la,2)+" m"});
  return C;
}
function planEnsemble(creer){
  V.croquis=V.croquis||[];
  for(var i=0;i<V.croquis.length;i++) if(!V.croquis[i].piece) return V.croquis[i];
  if(!creer) return null;
  var C=croquisVierge("Plan d'ensemble");
  V.croquis.push(C);
  return C;
}
/* Report d'un croquis de piece sur le plan d'ensemble, a la bonne echelle. */
function reporterSurPlan(C){
  var D=planEnsemble(true);
  var rect=null, i;
  for(i=0;i<C.el.length;i++) if(C.el[i].t==="piece"){ rect=C.el[i]; break; }
  if(!rect){ toast("Ce croquis n'a pas de rectangle de pièce","att"); return null; }
  if(!C.ech){ toast("Pose d'abord une échelle sur le croquis de la pièce","att"); return null; }
  if(!D.ech) D.ech={px:C.ech.px, m:C.ech.m};
  var k=(C.ech.m/C.ech.px)*(D.ech.px/D.ech.m);
  var niv=C.niv===undefined?1:C.niv;

  /* position du rectangle deja sur le plan : on la retient avant d'effacer quoi que ce soit */
  var ox=null, oy=null;
  for(i=0;i<D.el.length;i++){
    var A0=D.el[i];
    if(A0.t==="piece" && A0.nom===rect.nom && nivDe(A0)===niv){ ox=A0.x; oy=A0.y; break; }
  }
  /* on efface ce qui avait deja ete reporte pour cette piece, et le rectangle du meme nom */
  var garde=[];
  for(i=0;i<D.el.length;i++){
    var E=D.el[i];
    if(E.src===C.piece) continue;
    if(E.t==="piece" && !E.src && E.nom===rect.nom && nivDe(E)===niv) continue;
    garde.push(E);
  }
  D.el=garde;

  /* sinon on le pose sous ce qui existe deja */
  if(ox===null){
    ox=0.08;
    var bas=0.08;
    D.el.forEach(function(E){ if(E.t==="piece" && nivDe(E)===niv) bas=Math.max(bas, E.y+E.h); });
    oy=Math.min(bas+0.02, Math.max(0.08, D.ratio-rect.h*k-0.06));
  }
  function fx(x){ return r3(ox + (x-rect.x)*k); }
  function fy(y){ return r3(oy + (y-rect.y)*k); }

  var n=0;
  C.el.forEach(function(E){
    var N=JSON.parse(JSON.stringify(E));
    N.src=C.piece; N.n=niv;
    if(N.t==="piece"){ N.x=fx(E.x); N.y=fy(E.y); N.w=r3(E.w*k); N.h=r3(E.h*k); }
    else if(N.t==="cote"||N.t==="echelle"){ N.x1=fx(E.x1); N.y1=fy(E.y1); N.x2=fx(E.x2); N.y2=fy(E.y2); }
    else if(N.p){ for(var j=0;j<N.p.length;j+=2){ N.p[j]=fx(E.p[j]); N.p[j+1]=fy(E.p[j+1]); } }
    else { N.x=fx(E.x); N.y=fy(E.y); if(N.e!==undefined) N.e=E.e*k; }
    D.el.push(N); n++;
  });
  var bord=0;
  D.el.forEach(function(E){ if(E.t==="piece") bord=Math.max(bord, E.y+E.h); });
  if(bord+0.08 > D.ratio) D.ratio=Math.min(1.4, bord+0.08);
  D.niv=niv;
  sauverTout();
  return {plan:D, n:n};
}

/* Le metre : ce qu'on cherche au moment de chiffrer. */
function metreCroquis(C){
  var out={};
  C.el.forEach(function(E){
    if(E.t!=="liaison" || E.src) return;
    var k=E.res||"frigo", LL=longueurLiaison(C,E);
    if(!out[k]) out[k]={n:0, h:0, v:0, total:0, dims:{}, passages:{}};
    out[k].n++;
    out[k].h += LL.h||0;
    out[k].v += LL.v||0;
    out[k].total += LL.total||0;
    var d=txt(E.dim)||"section \u00e0 pr\u00e9ciser";
    out[k].dims[d]=(out[k].dims[d]||0)+(LL.total||0);

    /* Repartition par mode, troncon par troncon : trois metres en apparent
       et huit en facade ne se chiffrent pas de la meme facon. */
    var nseg=Math.max(0, Math.floor(E.p.length/2)-1), q;
    for(q=0;q<nseg;q++){
      var mp=passageSegment(E,q);
      if(!mp) continue;
      out[k].passages[mp]=(out[k].passages[mp]||0)+longueurSegment(C,E,q);
    }
    /* Les montees et descentes se rattachent au mode du troncon qui suit. */
    if(E.dz){
      for(var r=0;r<E.dz.length;r++){
        var dv=Math.abs(nb(E.dz[r])||0);
        if(!dv || !nseg) continue;
        var mq=passageSegment(E, Math.min(r, nseg-1));
        if(mq) out[k].passages[mq]=(out[k].passages[mq]||0)+dv;
      }
    }
  });
  return out;
}
function metreTotal(){
  var tot={}, perc=[], k;

    var m=metreCroquis(x.C);

      if(!tot[k]) tot[k]={n:0, h:0, v:0, total:0, dims:{}, passages:{}};
      tot[k].n+=m[k].n; tot[k].h+=m[k].h; tot[k].v+=m[k].v; tot[k].total+=m[k].total;
      for(var pk in m[k].passages){

function crResume(C){

          liaisons_vertical_m:mv?Math.round(mv*10)/10:null, percements:perc,

/* Poser les pieces, puis rapatrier ce qui a ete dessine dans chaque croquis de piece. */
function poserToutesLesPieces(){
  var C=planEnsemble(true);

  C.el.forEach(function(E){ if(!(E.t==="piece" && !E.src)) garde.push(E); });
  C.el=garde;
  if(!poserPieces(C)) return null;
  var n=0;
  V.pieces.forEach(function(P){

/* Le degagement : ce qui reste entre les pieces posees. On quadrille l'emprise,
   on marque ce qui est occupe, on ecarte l'exterieur par debordement depuis les
   bords, et ce qui reste enferme entre les pieces est le couloir. */
function deduireDegagement(C){
  var niv=(C.niv===undefined)?1:C.niv, pieces=[];
  C.el.forEach(function(E){ if(E.t==="piece" && nivDe(E)===niv && !E.deduit) pieces.push(E); });
  if(pieces.length<2) return {erreur:"Il faut au moins deux pièces posées sur ce niveau"};

  var x1=99, y1=99, x2=-99, y2=-99;
  pieces.forEach(function(E){
    var b=boitePoly(polyDe(E));
    x1=Math.min(x1,b.x); y1=Math.min(y1,b.y);
    x2=Math.max(x2,b.x+b.w); y2=Math.max(y2,b.y+b.h);
  });
  var pas=Math.max((x2-x1)/90, (y2-y1)/90, 0.003);
  var nx=Math.ceil((x2-x1)/pas)+2, ny=Math.ceil((y2-y1)/pas)+2;
  var ox=x1-pas, oy=y1-pas;
  var polys=pieces.map(function(E){ return polyDe(E); });

  var occ=[], j, i, k;
  for(j=0;j<ny;j++){
    occ[j]=[];
    for(i=0;i<nx;i++){
      var cx=ox+(i+0.5)*pas, cy=oy+(j+0.5)*pas, o=0;
      for(k=0;k<polys.length;k++) if(dansPoly(polys[k],cx,cy)){ o=1; break; }
      occ[j][i]=o;
    }
  }
  /* Un couloir de plan n'est pas un vide clos : il debouche souvent au bord.
     Le bon critere, c'est d'etre CERNE — avoir une piece dans au moins trois
     des quatre directions. Ce qui n'a de pieces que d'un cote, c'est le dehors. */
  function cernee(cj, ci){
    var g=0, d=0, h=0, b=0, q;
    for(q=ci-1;q>=0;q--) if(occ[cj][q]===1){ g=1; break; }
    for(q=ci+1;q<nx;q++) if(occ[cj][q]===1){ d=1; break; }
    for(q=cj-1;q>=0;q--) if(occ[q][ci]===1){ h=1; break; }
    for(q=cj+1;q<ny;q++) if(occ[q][ci]===1){ b=1; break; }
    /* Trois cotes sur quatre : c'est un couloir entre des pieces.
       A deux cotes seulement, on ramasse tout l'espace entre deux rangees
       et le resultat part en morceaux — teste, ecarte. */
    return (g+d+h+b) >= 3;
  }
  for(j=0;j<ny;j++) for(i=0;i<nx;i++){
    if(occ[j][i]===0 && !cernee(j,i)) occ[j][i]=2;
  }
  /* ce qui reste a 0 est du degagement : composantes connexes */
  var zones=[], vu={};
  for(j=0;j<ny;j++) for(i=0;i<nx;i++){
    if(occ[j][i]!==0 || vu[j+"_"+i]) continue;
    var comp=[], f=[[j,i]];
    vu[j+"_"+i]=1;
    while(f.length){
      var q=f.pop(), qj=q[0], qi=q[1];
      comp.push([qj,qi]);
      [[qj+1,qi],[qj-1,qi],[qj,qi+1],[qj,qi-1]].forEach(function(v){
        if(v[0]<0||v[1]<0||v[0]>=ny||v[1]>=nx) return;
        if(occ[v[0]][v[1]]!==0 || vu[v[0]+"_"+v[1]]) return;
        vu[v[0]+"_"+v[1]]=1; f.push(v);
      });
    }
    zones.push(comp);
  }
  if(!zones.length) return {erreur:"Aucun vide entre les pièces — elles sont jointives ou se recouvrent"};
  zones.sort(function(a,b){ return b.length-a.length; });
  var mini=Math.max(6, Math.round(0.0006/(pas*pas)));
  var out=[];
  zones.forEach(function(z){
    if(z.length<mini) return;
    var ctr=contourCellules(z, ox, oy, pas);
    if(ctr && ctr.length>=6) out.push({poly:ctr, cellules:z.length, aire:z.length*pas*pas});
  });
  if(!out.length) return {erreur:"Les vides trouvés sont trop petits pour être des dégagements"};
  return {zones:out, pas:pas};
}
/* Contour d'un paquet de cellules : les aretes partagees s'annulent, les autres se chainent. */
function contourCellules(cells, ox, oy, pas){
  var dans={}, i;
  for(i=0;i<cells.length;i++) dans[cells[i][0]+"_"+cells[i][1]]=1;
  var aretes={};
  function cle(a,b,c,d){ return a+"_"+b+"|"+c+"_"+d; }
  for(i=0;i<cells.length;i++){
    var j=cells[i][0], k=cells[i][1];
    if(!dans[(j-1)+"_"+k]) aretes[cle(k,j,k+1,j)]=[k,j,k+1,j];
    if(!dans[(j+1)+"_"+k]) aretes[cle(k+1,j+1,k,j+1)]=[k+1,j+1,k,j+1];
    if(!dans[j+"_"+(k-1)]) aretes[cle(k,j+1,k,j)]=[k,j+1,k,j];
    if(!dans[j+"_"+(k+1)]) aretes[cle(k+1,j,k+1,j+1)]=[k+1,j,k+1,j+1];
  }
  var depart=null, parDebut={};
  for(var a in aretes){
    if(!aretes.hasOwnProperty(a)) continue;
    var e=aretes[a];
    parDebut[e[0]+"_"+e[1]] = parDebut[e[0]+"_"+e[1]] || [];
    parDebut[e[0]+"_"+e[1]].push(e);
    if(!depart) depart=e;
  }
  if(!depart) return null;
  var chemin=[[depart[0],depart[1]]], cur=depart, garde=0;
  while(garde++ < 20000){
    var suite=parDebut[cur[2]+"_"+cur[3]];
    if(!suite || !suite.length) break;
    var suiv=suite.shift();
    chemin.push([suiv[0],suiv[1]]);
    cur=suiv;
    if(cur[2]===depart[0] && cur[3]===depart[1]) break;
  }
  /* on retire les points alignes, puis on repasse en coordonnees du plan */
  var simple=[];
  for(i=0;i<chemin.length;i++){
    var pv=chemin[(i-1+chemin.length)%chemin.length], pt=chemin[i], nx2=chemin[(i+1)%chemin.length];
    var d1x=pt[0]-pv[0], d1y=pt[1]-pv[1], d2x=nx2[0]-pt[0], d2y=nx2[1]-pt[1];
    if(d1x*d2y-d1y*d2x===0) continue;
    simple.push(pt);
  }
  if(simple.length<3) simple=chemin;
  var poly=[];
  for(i=0;i<simple.length;i++){
    poly.push(r3(ox+simple[i][0]*pas), r3(oy+simple[i][1]*pas));
  }
  return poly;
}
function poserPieces(C){
  var dispo=[];
  V.pieces.forEach(function(P){
    var l=nb(P.lg), la=nb(P.la), sp=surfacePiece(P);
    if(l===null||la===null){
      if(sp===null) return;
      l=Math.sqrt(sp*1.3); la=sp/l;
    }
    dispo.push({nom:txt(P.nom)||"Pi\u00e8ce", l:l, la:la, s:l*la, niv:nivIndex(P.niveau)});
  });
  if(!dispo.length){ toast("Aucune pi\u00e8ce cot\u00e9e dans l'onglet Pi\u00e8ces","att"); return false; }

  var parNiv={}, k;
  dispo.forEach(function(x){ if(!parNiv[x.niv]) parNiv[x.niv]=[]; parNiv[x.niv].push(x); });

  /* une seule echelle pour tous les niveaux, sinon les etages ne se superposent plus */
  var lMax=0;
  for(k in parNiv){ if(parNiv.hasOwnProperty(k)) lMax=Math.max(lMax, largeurGroupe(parNiv[k])); }
  var marge=0.08;
  var ech=(1-2*marge)/lMax;

  var ratioMax=0.55, premier=null;
  for(k in parNiv){
    if(!parNiv.hasOwnProperty(k)) continue;
    var n=parseInt(k,10);
    ratioMax=Math.max(ratioMax, poserGroupe(C, parNiv[k], n, ech, marge));
    if(premier===null || n===1) premier=n;
  }
  C.ratio=Math.min(1.4, ratioMax);
  C.niv=premier;
  C.ech={px:dispo[0].l*ech, m:dispo[0].l};
  return true;
}
function rangeesDe(dispo){
  dispo.sort(function(a,b){ return b.s-a.s; });
  var parRangee=Math.ceil(Math.sqrt(dispo.length));
  var rangees=[], r=[];
  for(var i=0;i<dispo.length;i++){
    r.push(dispo[i]);
    if(r.length===parRangee){ rangees.push(r); r=[]; }
  }
  if(r.length) rangees.push(r);
  return rangees;
}
function largeurGroupe(dispo){
  var lMax=0;
  rangeesDe(dispo).forEach(function(rg){
    var lr=0;
    rg.forEach(function(p){ lr+=p.l; });
    lMax=Math.max(lMax, lr);
  });
  return lMax;
}
function poserGroupe(C, dispo, niveau, ech, marge){
  var y=marge;
  rangeesDe(dispo).forEach(function(rg){
    var x=marge, hr=0;
    rg.forEach(function(p){
      C.el.push({t:"piece", n:niveau, x:r3(x), y:r3(y), w:r3(p.l*ech), h:r3(p.la*ech),
                 nom:p.nom, info:fmt(p.l,2)+" \u00d7 "+fmt(p.la,2)+" m"});
      x+=p.l*ech;
      hr=Math.max(hr, p.la*ech);
    });
    y+=hr;
  });
  return y+marge;
}
function crRaster(C, largeur, niveau, fn){
  var w=largeur||1600, h=Math.round(w*C.ratio);
  var cv=document.createElement("canvas");
  cv.width=w; cv.height=h;
  var ctx=cv.getContext("2d");
  function fini(img){
    crDessiner(C,ctx,w,h,img,null,{z:1,ox:0,oy:0,niv:(niveau===undefined?(C.niv||1):niveau)});
    fn(cv.toDataURL("image/jpeg",0.72));
  }
  if(C.photo){
    var im=new Image();
    im.onload=function(){ fini(im); };
    im.onerror=function(){ fini(null); };
    im.src=C.photo;
  } else fini(null);
}

      (x.detail.length ? "<br><span class='mini'>&nbsp;&nbsp;"+x.detail.join(" · ")+"</span>" : "")+"<br>";
  });
  h += "<span class='mini'>Longueurs relevées sur les croquis, dénivelées comprises. À majorer des chutes et des raccordements avant de chiffrer.</span>";
  b.innerHTML=h;
  parent.appendChild(b);
  return true;
}

}
