<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche chantier KA-RÉ</title>
<meta name="description" content="Relevé de RDV devis KA-RÉ — chantiers Axonaut, lots techniques, dimensionnement pièce par pièce.">
<meta name="theme-color" content="#0D3B66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chantier KA-RÉ">
<style>
:root{
  --fond:#EEF2F6; --carte:#FFFFFF; --carte2:#F5F8FB;
  --trait:#C9D6E2; --trait2:#E2EAF2;
  --texte:#0E1A26; --texte2:#3D5468; --texte3:#6B8199;
  --marque:#0D3B66; --surmarque:#FFFFFF;
  --ok:#146B3A; --okf:#E0F2E7;
  --att:#9A5B00; --attf:#FCEEDA;
  --mal:#A31D14; --malf:#FAE4E1;
  --presse:#D6E3EF; --pressep:#08284A;
  --ui:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --corps:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fond:#080F16; --carte:#101B26; --carte2:#16232F;
    --trait:#28394B; --trait2:#1D2C3A;
    --texte:#E9F0F6; --texte2:#A8BCCD; --texte3:#7A92A7;
    --marque:#84B6DC; --surmarque:#08131D;
    --ok:#5FCB8D; --okf:#0D2C1D;
    --att:#E9AC52; --attf:#33230B;
    --mal:#F27C6E; --malf:#371310;
    --presse:#26394C; --pressep:#B4D6EF;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--fond);color:var(--texte);font-family:var(--corps);
     font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.barre{position:sticky;top:0;z-index:40;background:var(--marque);color:var(--surmarque);
  display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:45px}
.barre .logo{height:22px;width:auto;flex:0 0 auto}
.barre .titre{font-family:var(--ui);font-weight:600;font-size:17px;flex:1 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{font-family:var(--ui);font-size:12px;font-weight:600;padding:2px 8px;
  border-radius:100px;background:rgba(255,255,255,.16);white-space:nowrap}
.pastille.ok{background:var(--okf);color:var(--ok)}
.pastille.mal{background:var(--malf);color:var(--mal)}
.icb{background:rgba(255,255,255,.14);border:none;color:inherit;font-family:var(--ui);
  font-size:15px;font-weight:600;border-radius:8px;min-height:34px;padding:0 10px;cursor:pointer}
#onglets{position:sticky;top:45px;z-index:35;background:var(--carte);
  border-bottom:1px solid var(--trait);display:flex;gap:4px;padding:6px 8px;overflow-x:auto}
.ong{flex:0 0 auto;font-family:var(--ui);font-weight:600;font-size:15px;min-height:40px;
  padding:0 13px;border-radius:8px;border:1px solid var(--trait);background:var(--carte2);
  color:var(--texte2);cursor:pointer;display:flex;align-items:center;gap:6px}
.ong[aria-selected="true"]{background:var(--marque);color:var(--surmarque);border-color:var(--marque)}
.ong .pc{background:var(--mal);color:#fff;border-radius:100px;font-size:11px;padding:1px 6px}
.ong .pcok{background:var(--ok);color:#fff;border-radius:100px;font-size:11px;padding:1px 6px}
main{max-width:900px;margin:0 auto;padding:12px 12px 130px}
h2{font-family:var(--ui);font-weight:700;font-size:22px;margin:14px 0 8px}
h3{font-family:var(--ui);font-weight:600;font-size:17px;margin:16px 0 6px;color:var(--texte2)}
p.aide{font-size:14px;color:var(--texte3);margin:2px 0 10px}
.mini{font-size:13px;color:var(--texte3)}
.bloc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  margin:0 0 10px;overflow:hidden}
.bloc>summary{font-family:var(--ui);font-weight:600;font-size:17px;padding:12px 14px;
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;list-style:none}
.bloc>summary::-webkit-details-marker{display:none}
.bloc>summary::after{content:"\25BE";color:var(--texte3);font-size:14px}
.bloc[open]>summary::after{content:"\25B4"}
.bloc>summary .cpt{font-family:var(--num);font-size:12px;color:var(--texte3);font-weight:400}
.bloc>div{padding:0 14px 12px}
.q{padding:10px 0;border-top:1px solid var(--trait2)}
.q:first-child{border-top:none}
.q .lib{font-weight:500;margin-bottom:7px;display:block}
.q .lib .info{display:block;font-size:13px;color:var(--texte3);font-weight:400;margin-top:1px}
.etats{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.et{font-family:var(--ui);font-weight:600;font-size:14px;min-height:38px;padding:0 12px;
  border-radius:8px;border:1px solid var(--trait);background:var(--carte2);color:var(--texte2);cursor:pointer}
.et.on-ok{background:var(--okf);border-color:var(--ok);color:var(--ok)}
.et.on-att{background:var(--attf);border-color:var(--att);color:var(--att)}
.et.on-np{background:var(--trait2);border-color:var(--trait);color:var(--texte3)}
.et.ph{margin-left:auto}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=time],textarea,select{
  width:100%;min-height:44px;font-size:16px;font-family:var(--corps);background:var(--carte2);
  color:var(--texte);border:1px solid var(--trait);border-radius:8px;padding:8px 10px}
input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums}
textarea{min-height:90px;resize:vertical;line-height:1.4}
.champ{display:block}
.champ label.ch{margin-top:8px}
.rang{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.rang>*{flex:1 1 140px;min-width:0}
.rang label.ch{min-height:30px;display:flex;align-items:flex-end}
label.ch{display:block;font-size:13px;color:var(--texte3);font-family:var(--ui);
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:8px 0 3px}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puce{font-family:var(--ui);font-weight:600;font-size:14px;min-height:40px;padding:0 12px;
  border-radius:100px;border:1px solid var(--trait);background:var(--carte2);color:var(--texte2);cursor:pointer}
.puce.on{background:var(--marque);border-color:var(--marque);color:var(--surmarque)}
.btn{font-family:var(--ui);font-weight:600;font-size:16px;min-height:48px;padding:0 16px;
  border-radius:10px;border:1px solid var(--trait);background:var(--carte);color:var(--texte);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.p{background:var(--marque);color:var(--surmarque);border-color:var(--marque)}
.btn.mini{min-height:38px;font-size:14px;padding:0 11px}
.btn.d{color:var(--mal);border-color:var(--mal)}
.btn.large{width:100%;margin:8px 0}
.chl{list-style:none;padding:0;margin:0}
.chl li{margin:0 0 8px}
.chb{width:100%;text-align:left;background:var(--carte);border:1px solid var(--trait);
  border-radius:var(--r);padding:12px 14px;cursor:pointer;display:block;color:inherit;font-family:var(--corps)}
.chb .t{font-family:var(--ui);font-weight:600;font-size:17px;display:block;margin-bottom:2px}
.chb .s{font-size:14px;color:var(--texte2);display:block}
.chb .e{font-family:var(--num);font-size:11px;color:var(--texte3);text-transform:uppercase;letter-spacing:.05em}
.piece{background:var(--carte2);border:1px solid var(--trait);border-radius:var(--r);padding:12px;margin:0 0 10px}
.piece .tete{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.piece .tete .n{font-family:var(--ui);font-weight:600;font-size:16px}
.mur{border-top:1px dashed var(--trait);padding:8px 0 4px}
.mur:first-child{border-top:none}
.mur .ml{font-family:var(--ui);font-weight:600;font-size:15px;margin-bottom:4px;display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.calc{font-family:var(--num);font-size:14px;background:var(--carte);border:1px solid var(--trait2);
  border-radius:8px;padding:8px 10px;margin:8px 0 0;color:var(--texte2)}
.calc b{color:var(--texte);font-weight:600}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ph{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--trait)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;
  border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1}
.ph .lg{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:10px;padding:1px 3px;text-align:center;font-family:var(--ui)}
.alerte{border-radius:var(--r);padding:11px 13px;margin:0 0 10px;font-size:15px;border:1px solid}
.alerte.mal{background:var(--malf);border-color:var(--mal);color:var(--mal)}
.alerte.att{background:var(--attf);border-color:var(--att);color:var(--att)}
.alerte.ok{background:var(--okf);border-color:var(--ok);color:var(--ok)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--carte);
  border-top:1px solid var(--trait);display:flex;gap:8px;padding:8px 12px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.actions .btn{flex:1 1 auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;
  background:var(--texte);color:var(--fond);padding:10px 16px;border-radius:10px;
  font-family:var(--ui);font-weight:600;font-size:15px;max-width:90%;text-align:center;display:none}
#toast.ok{background:var(--ok);color:#fff}
#toast.mal{background:var(--mal);color:#fff}
#toast.att{background:var(--att);color:#fff}
dialog{border:1px solid var(--trait);border-radius:var(--r);background:var(--carte);
  color:var(--texte);padding:0;max-width:560px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-tete{font-family:var(--ui);font-weight:700;font-size:19px;padding:14px 16px 0}
.dlg-corps{padding:10px 16px 16px}
#client{position:fixed;inset:0;z-index:80;background:var(--fond);overflow-y:auto;display:none}
#client .in{max-width:620px;margin:0 auto;padding:22px 18px 40px}
#client h2{font-size:26px}
#client input{min-height:52px;font-size:17px}
.verrou{text-align:center;padding:22px}
.verrou input{max-width:180px;margin:10px auto;text-align:center;font-family:var(--num);
  font-size:22px;letter-spacing:.4em}

/* --- croquis --- */
.cred{position:fixed;inset:0;z-index:90;background:var(--fond);display:flex;flex-direction:column}
.crhaut{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--marque);
  color:var(--surmarque);flex-wrap:nowrap;overflow-x:auto}
.crtitre{flex:1 1 auto;font-family:var(--ui);font-weight:700;font-size:17px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding:0 4px;cursor:pointer;min-width:60px}
.crb{font-family:var(--ui);font-weight:600;font-size:15px;min-height:42px;padding:0 12px;
  border-radius:9px;border:1px solid var(--trait);background:var(--carte);color:var(--texte);
  cursor:pointer;white-space:nowrap;flex:0 0 auto}
.crb.on{background:var(--marque);color:var(--surmarque);border-color:var(--marque)}
.crb.d{color:var(--mal);border-color:var(--mal)}
.crhaut .crb{min-height:38px;font-size:14px;padding:0 10px}
.crzone{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
  background:#D8E2EC;overflow:hidden;min-height:0}
.crcv{background:#fff;touch-action:none;-ms-touch-action:none;border-radius:4px;
  box-shadow:0 2px 14px rgba(14,26,38,.22);cursor:crosshair;display:block}
.crzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px}
.crzb{width:42px;height:42px;border-radius:11px;border:1px solid var(--trait);
  background:rgba(255,255,255,.94);font-family:var(--ui);font-weight:700;font-size:19px;
  color:var(--texte);cursor:pointer;box-shadow:0 1px 5px rgba(14,26,38,.16);padding:0}
.crinfo{position:absolute;left:10px;top:8px;font-size:13px;color:var(--texte2);
  background:rgba(255,255,255,.88);padding:3px 9px;border-radius:7px;pointer-events:none;max-width:90%}
.crbas{display:flex;gap:5px;padding:7px 8px;background:var(--carte);border-top:1px solid var(--trait);
  overflow-x:auto;align-items:center}
.crsep{flex:0 0 1px;height:30px;background:var(--trait);margin:0 4px}
.crc{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px var(--trait);cursor:pointer;padding:0}
.crc.on{box-shadow:0 0 0 3px var(--marque)}
.crniv{display:flex;gap:6px;align-items:center;padding:5px 8px;background:var(--carte2);
  border-bottom:1px solid var(--trait);overflow-x:auto}
.crniv .crb{min-height:36px;font-size:14px;padding:0 11px}
.crctx{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--attf);
  border-top:1px solid var(--trait);overflow-x:auto}
.crctxn{font-family:var(--ui);font-weight:700;font-size:15px;white-space:nowrap;flex:0 0 auto}
.crpal{display:flex;flex-wrap:wrap;gap:6px;padding:9px;background:var(--carte2);
  border-top:1px solid var(--trait);max-height:44vh;overflow-y:auto}
.crsym{flex:0 0 auto;width:92px;background:var(--carte);border:1px solid var(--trait);
  border-radius:9px;padding:5px 3px 6px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-family:var(--ui);font-size:12px;color:var(--texte2)}
.crsym canvas{width:76px;height:52px}
.crdlg{position:fixed;inset:0;z-index:95;background:rgba(14,26,38,.55);display:flex;
  align-items:center;justify-content:center;padding:16px}
.crdlgb{background:var(--carte);padding:16px 18px 14px;border-radius:12px;width:100%;max-width:420px}
.crdlgb h3{font-family:var(--ui);font-size:19px;margin:0 0 4px}
.crdlgb input{width:100%;min-height:50px;font-size:17px;margin-top:8px}
.crdlgz{display:flex;gap:8px;margin-top:12px}
.crdlgz .btn{flex:1}
.crliste{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.crcarte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:8px;
  display:flex;flex-direction:column;gap:6px;max-width:262px}
.crcarte canvas{border:1px solid var(--trait2);border-radius:6px;cursor:pointer;
  max-width:100%;height:auto}
.crnom{font-family:var(--ui);font-weight:700;font-size:16px}
.crmeta{display:flex;flex-direction:column;gap:4px}
.rang2{display:flex;gap:6px}
:focus-visible{outline:2px solid var(--marque);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==== RETOUR AU DOIGT ====
   Sur tablette, sans changement visible a l'appui on ne sait pas si le geste a
   porte : on rappuie, et l'action part deux fois. Le highlight natif d'Android
   est desactive plus haut (rectangle qui deborde des coins arrondis), donc on
   le refait proprement ici. Le fond change instantanement, il revient en
   douceur : c'est l'appui qu'on veut voir, pas le relachement. */
.btn,.puce,.et,.ong,.chb,.crb,.crzb,.crsym,.bloc>summary{
  transition:background-color .13s ease,border-color .13s ease}
.btn:active,.puce:active,.et:active,.ong:active,.chb:active,
.crb:active,.crzb:active,.crsym:active,.bloc>summary:active{
  background:var(--presse);border-color:var(--texte3);transform:translateY(1px)}
/* Sur les boutons deja colores, assombrir ne se voit pas en plein soleil :
   on ajoute un lisere interieur de la couleur du texte, visible dans les deux themes. */
.btn.p:active,.puce.on:active,.crb.on:active,.ong[aria-selected="true"]:active{
  background:var(--pressep);border-color:var(--pressep);color:var(--surmarque);
  box-shadow:inset 0 0 0 2px var(--surmarque)}
.btn.d:active{background:var(--malf);border-color:var(--mal);color:var(--mal)}
/* Ceux-la sont sur fond fonce ou sur une photo : les eclaircir, pas les blanchir. */
.icb:active{background:rgba(255,255,255,.36)}
.ph button:active{background:rgba(0,0,0,.88);transform:scale(.88)}
.crc:active{transform:scale(.88)}
.crtitre:active{opacity:.55}
</style>
</head>
<body>

<div class="barre">
  <img class="logo" id="logo" alt="KA-RÉ">
  <span class="titre" id="tBarre">Fiche chantier</span>
  <span class="pastille" id="pEtat">prêt</span>
  <button class="icb" id="bReglages" type="button" aria-label="Réglages">&#9881;</button>
</div>

<div id="onglets" role="tablist"></div>
<main id="app"></main>
<div class="actions" id="actions"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="client"><div class="in" id="clientIn"></div></div>

<dialog id="dlgReglages"><div class="dlg-tete">Réglages</div><div class="dlg-corps" id="corpsReglages"></div></dialog>
<dialog id="dlgLots"><div class="dlg-tete">Ajouter un lot</div><div class="dlg-corps" id="corpsLots"></div></dialog>
<dialog id="dlgTexte"><div class="dlg-tete">Texte</div><div class="dlg-corps" id="corpsTexte"></div></dialog>

<script>
"use strict";
var VERSION = "2.8";
/* Android n'applique :active que si la page ecoute le tactile quelque part.

function $(s){ return document.querySelector(s); }
function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e; }
function txt(v){ return (v===undefined||v===null) ? "" : String(v).trim(); }

function nb(v){ if(v===""||v===null||v===undefined) return null;
  var x=parseFloat(String(v).replace(",",".")); return isNaN(x)?null:x; }
function fmt(v,d){ if(v===null||v===undefined||isNaN(v)) return ""; return v.toFixed(d===undefined?0:d).replace(".",","); }
function slug(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function propre(v){
  if(v===undefined||v===null) return null;
  var x = String(v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"")
    .replace(/\r\n?/g,"\n").replace(/"/g,"”").replace(/\\/g,"/").trim();
  return x || null;
}
/* double appui : confirm() est bloqué dans certains navigateurs embarqués */
function arme(bouton, libelleConfirme, action){
  bouton.onclick = function(){
    if(bouton.dataset.arme){ delete bouton.dataset.arme; action(); return; }
    bouton.dataset.arme="1";
    var avant = bouton.textContent;
    bouton.textContent = libelleConfirme;
    setTimeout(function(){
      if(bouton.dataset.arme){ delete bouton.dataset.arme; bouton.textContent = avant; }
    }, 5000);
  };
}

function fusionner(cible, modele){
  for(var k in modele){
    if(!modele.hasOwnProperty(k)) continue;
    if(cible[k]===undefined || cible[k]===null){ cible[k]=modele[k]; continue; }
    if(modele[k] && typeof modele[k]==="object" && !(modele[k] instanceof Array)
       && cible[k] && typeof cible[k]==="object") fusionner(cible[k], modele[k]);
  }
  return cible;
}

  if(cfg.veille==="non") return;
  if(!navigator.wakeLock || !navigator.wakeLock.request) return;
  if(verrouEcran) return;
  try{

      verrouEcran=v;
      v.addEventListener("release", function(){ verrouEcran=null; });

}

   ============================================================ */
function parseCommentaire(c){
  var o = {nom:"",tel:"",email:"",adresse:"",ville:"",logement:"",statut:"",objet:"",drive:"",notes:txt(c)};
  if(!c) return o;
  var lignes = String(c).split(/\n/);
  var champ = {"nom":"nom","e-mail":"email","email":"email","mail":"email",
    "telephone":"tel","téléphone":"tel","tel":"tel","adresse":"adresse","ville":"ville",
    "type de logement":"logement","est-il bien le proprietaire":"statut",
    "est-il bien le propriétaire":"statut","description":"objet","dossier drive":"drive"};
  for(var i=0;i<lignes.length;i++){
    var L=lignes[i], p=L.indexOf(":");
    if(p<1) continue;
    var k=L.slice(0,p).trim().toLowerCase(), v=L.slice(p+1).trim();
    if(k==="dossier drive"){ o.drive=v; continue; }
    var cible=champ[k];
    if(cible && !o[cible] && v && v!=="<UNKNOWN>") o[cible]=v;
  }
  if(/^true$/i.test(o.statut)) o.statut="Propriétaire";
  if(/^false$/i.test(o.statut)) o.statut="Locataire";
  return o;
}

function chargerListe(manuel){
  if(!cfg.webhookListe){ if(manuel) toast("Adresse de la liste non renseignée — voir Réglages","mal"); return; }
  if(navigator.onLine===false){ if(manuel) toast("Pas de réseau — liste en cache","att"); return; }
  if(manuel) toast("Chargement…");
  fetch(cfg.webhookListe, {method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:"payload="+encodeURIComponent(JSON.stringify({secret:cfg.secret||"", action:"liste"}))})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(d){
    var arr = d.chantiers || d.array || d;
    if(!Array.isArray(arr)) throw new Error("format inattendu");
    liste = {maj:new Date().toISOString(), chantiers: arr.map(normChantier)};
    ecrire(CLE_LISTE, liste);
    if(vue==="accueil") rendre();
    if(manuel) toast(liste.chantiers.length+" chantiers chargés","ok");
  })
  .catch(function(e){
    if(manuel) toast("Liste non chargée — "+e.message+". Vérifie l'en-tête CORS du webhook Make.","mal");
  });
}
function normChantier(x){
  var b=x.bundle||x, soc=b.company||{};
  return {opp_id:b.id||b.opp_id||null, titre:txt(b.name||b.titre), etape:txt(b.pipe_step_name||b.etape),
    societe_id:soc.id||b.societe_id||null, societe:txt(soc.name||b.societe),
    commentaire:txt(b.comments||b.commentaire), date:txt(b.creation_date||b.date)};
}
function collerListe(t){
  try{
    var d=JSON.parse(t);
    var arr = d.chantiers||d.array||(d.result&&d.result.outputs&&d.result.outputs.tool_output&&d.result.outputs.tool_output.array)||d;
    if(!Array.isArray(arr)) throw new Error("format");
    liste={maj:new Date().toISOString(), chantiers:arr.map(normChantier)};
    ecrire(CLE_LISTE, liste);
    toast(liste.chantiers.length+" chantiers importés","ok");
    if(vue==="accueil") rendre();
    return true;
  }catch(e){ toast("JSON illisible","mal"); return false; }
}

function lotParId(id){ for(var i=0;i<V.lots.length;i++) if(V.lots[i].lid===id) return V.lots[i]; return null; }
function defLot(cle){ for(var i=0;i<LOTS.length;i++) if(LOTS[i].cle===cle) return LOTS[i]; return LOTS[LOTS.length-1]; }
function questions(L){
  var d=defLot(L.cle), out=[];
  d.q.forEach(function(q){ if(!q.si || q.si(L)) out.push(q); });
  return out;
}
function besoinPieces(){ for(var i=0;i<V.lots.length;i++) if(V.lots[i].pieces) return true; return false; }
function aLotClim(){ for(var i=0;i<V.lots.length;i++) if(V.lots[i].cle==="clim") return true; return false; }
function aLotPac(){ for(var i=0;i<V.lots.length;i++) if(V.lots[i].cle==="pac") return true; return false; }

var vueRendue=null;
function rendre(){
  /* On reste ou on etait : seul un changement d'onglet ramene en haut. */
  var memeVue = (vueRendue===vue);
  var y = memeVue ? (window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
  vueRendue = vue;
  rendreOnglets();
  var a=$("#app"); a.innerHTML="";
  if(vue==="accueil") vueAccueil(a);
  else if(vue==="client") vueClient(a);
  else if(vue==="maison") vueMaison(a);
  else if(vue==="pieces") vuePieces(a);
  else if(vue==="croquis") vueCroquis(a);
  else if(vue==="ndd") vueNdd(a);
  else if(vue==="notes") vueNotes(a);
  else if(vue==="envoi") vueEnvoi(a);
  else vueLot(a, lotParId(vue));
  rendreActions();
  $("#tBarre").textContent = txt(V.client.nom) || "Fiche chantier";
  if(memeVue && y>0){
    try{ window.scrollTo(0, y); }catch(e){}
    /* le contenu peut grandir apres coup (images, blocs) : on repose la position */
    setTimeout(function(){
      if(vueRendue===vue && Math.abs((window.pageYOffset||0) - y) > 4){
        try{ window.scrollTo(0, y); }catch(e){}
      }
    }, 0);
  }
}

/* L'ecran est reconstruit a chaque appui. Sans memoire de ce qui etait deplie,
   tout se refermait sous les doigts : c'est le defaut le plus penible a l'usage. */
var BLOCS = {};
function memoDetails(d, cle){
  d.open = !!BLOCS[cle];
  d.addEventListener("toggle", function(){ BLOCS[cle]=d.open; });
}
function bloc(parent, titre, cpt, ouvert){
  var cle = vue+"|"+titre;
  var d=el("details","bloc");
  d.open = (BLOCS[cle]!==undefined) ? BLOCS[cle] : !!ouvert;
  var s=el("summary",null,titre);
  if(cpt) s.appendChild(el("span","cpt",cpt));
  d.appendChild(s);
  d.addEventListener("toggle", function(){ BLOCS[cle]=d.open; });
  var corps=el("div"); d.appendChild(corps); parent.appendChild(d);
  return corps;
}
/* Choix multiple : une maison peut avoir un etage ET une cave ET des combles. */
function pucesMulti(parent, lib, opts, vals, onc){
  if(lib) parent.appendChild(el("label","ch",lib));
  var w=el("div","puces");
  var courant = (vals instanceof Array) ? vals.slice() : [];
  opts.forEach(function(o){
    var actif=false;
    for(var i=0;i<courant.length;i++) if(courant[i]===o) actif=true;
    var b=el("button","puce"+(actif?" on":""),o); b.type="button";
    b.onclick=function(){
      var out=[], trouve=false;
      for(var j=0;j<courant.length;j++){
        if(courant[j]===o){ trouve=true; continue; }
        out.push(courant[j]);
      }
      if(!trouve) out.push(o);
      onc(out);
    };
    w.appendChild(b);
  });
  parent.appendChild(w);
  return w;
}
function puces(parent, lib, opts, val, onc){
  if(lib) parent.appendChild(el("label","ch",lib));
  var w=el("div","puces");
  opts.forEach(function(o){
    var b=el("button","puce"+(val===o?" on":""),o); b.type="button";
    b.onclick=function(){ onc(val===o?"":o); };
    w.appendChild(b);
  });
  parent.appendChild(w);
  return w;
}

  if(L.cle==="gaz"){
    if(rep(L,"condens")==="Oui"){
      var x=el("div","alerte mal");

      a.appendChild(x);
    }
    var t=el("div","alerte att");
    t.textContent="TVA 20 % sur la chaudière et sur tous les travaux accessoires. Certificat de conformité gaz et disconnecteur sont mis d'office au devis.";
    a.appendChild(t);
  }
  if(L.cle==="pac"){
    if(rep(L,"remplace")==="Chaudière gaz condensation"){
      var y=el("div","alerte mal");
      y.textContent="Condensation déposée — le Coup de pouce ×5 ne s'applique pas. Seul le CEE de base reste mobilisable.";
      a.appendChild(y);
    }
    if(rep(L,"isolcoh")==="Non — devoir de conseil écrit"){
      var z=el("div","alerte att");
      z.textContent="Devoir de conseil : l'écrit est obligatoire quand l'enveloppe ou les émetteurs ne sont pas adaptés (art. 1112-1 Code civil).";
      a.appendChild(z);
    }

      var c=el("div","alerte mal");
      c.textContent="Aménagement de combles ou extension — au-delà de +10 % de surface de plancher, tout le lot clim passe à 20 %.";
      a.appendChild(c);

      var e=el("div","alerte att");
      e.textContent="R+1 ou R+2 : Select Clim ne propose plus qu'un seul gainable, en gamme Confort Plus. Pour deux gainables, il faut deux études.";
      a.appendChild(e);
    }
    var v=el("div","alerte att");
    v.textContent="TVA 5,5 % sous conditions : A++ mono-split ou A+ multi-split, en SEER et en SCOP, ≤ 12 kW, fluide conforme, appareil connectable.";

  var aGaz=false;
  V.lots.forEach(function(x){ if(x.cle==="gaz") aGaz=true; });

    var m=el("div","alerte mal");

    else c.innerHTML="<b>Vase supplémentaire : "+x.taille+" L</b><br><span class='mini'>Besoin calculé "+fmt(x.Vn,1)+" L"+

    z.appendChild(el("p","mini","Renseigne la hauteur statique et le tarage de la soupape pour obtenir la taille du vase."));

      "<br><span class='mini'>Projipack ne raisonne pas en pièces mais en circuits : un circuit = une surface, une hauteur, un type d'émetteur, un régime. C'est cette répartition qu'il faut lui saisir.</span>";
    a.appendChild(cc);
  }
  if(V.pieces.length){
    var t=totaux();
    var c=el("div","calc");
    c.innerHTML = "<b>Total</b> — "+fmt(t.vol,1)+" m³ · déperditions ~"+fmt(t.dt)+" W · chaud ~"+fmt(t.chaud)+
      " W · froid ~"+fmt(t.froid)+" W · débit ~"+fmt(t.debit)+" m³/h"+
      "<br><span class='mini'>Pré-dimensionnement · G "+(gEstime()?"estimé":"saisi")+" à "+fmt(coefG(),2)+
      " · ratio froid "+ratioFroid()+" W/m³. À confirmer par Select Clim ou Projipack.</span>";
    a.appendChild(c);

    if(aLotClim()){
      var pb=el("button","btn large","📋 Copier le prompt Select Clim"); pb.type="button";
      pb.onclick=function(){ copier(promptSelectClim(),"Prompt Select Clim"); };
      a.appendChild(pb);
    }
    if(aLotPac()){
      var pp=el("button","btn large","📋 Copier le prompt Projipack"); pp.type="button";
      pp.onclick=function(){ copier(promptProjipack(),"Prompt Projipack"); };
      a.appendChild(pp);
    }
  }
}

function ajouterPiece(){
  var last=V.pieces[V.pieces.length-1];
  var P={pid:idUnique("p"), nom:"", lg:"", la:"", surf:"", hsp: last?last.hsp:"2,5", niveau:"", circuit: last?last.circuit:"",
         murs:[], rads:[], clim:{traite:"",empl:"",liaison:"",mode:""}, photos:[], croquis:[]};
  murs4(P);
  V.pieces.push(P);
  sauverTout(); rendre();
}
function murs4(P){
  if(P.murs.length) return;
  P.murs = [
    {id:idUnique("m"), nom:"Mur 1", auto:"lg", lg:"", type:"Extérieur", o:"", vit:"", n:1},
    {id:idUnique("m"), nom:"Mur 2", auto:"la", lg:"", type:"Extérieur", o:"", vit:"", n:1},
    {id:idUnique("m"), nom:"Mur 3", auto:"lg", lg:"", type:"Cloison",   o:"", vit:"", n:1},
    {id:idUnique("m"), nom:"Mur 4", auto:"la", lg:"", type:"Cloison",   o:"", vit:"", n:1}
  ];
}
function longueurMur(P,M){
  var v=nb(M.lg);
  if(v!==null) return v;
  if(M.auto==="lg") return nb(P.lg);
  if(M.auto==="la") return nb(P.la);
  return null;
}
function surfacePiece(P){
  var s=nb(P.surf);
  if(s!==null) return s;
  var l=nb(P.lg), g=nb(P.la);
  if(l!==null && g!==null) return l*g;
  return null;
}

function cartePiece(a,P,idx){
  var w=el("div","piece");
  var tete=el("div","tete");
  tete.appendChild(el("span","n","Pièce "+(idx+1)+(P.nom?" — "+P.nom:"")));
  var sup=el("button","btn mini d","✕"); sup.type="button";
  arme(sup,"Confirmer",function(){ V.pieces.splice(idx,1); sauverTout(); rendre(); });
  tete.appendChild(sup);
  w.appendChild(tete);

  champ(w,"Nom de la pièce", P.nom, function(v){ P.nom=v; });
  var r=el("div","rang"); w.appendChild(r);
  champ(r,"Longueur (m)", P.lg, function(v){ P.lg=v; majCalculs(); }, "number");
  champ(r,"Largeur (m)", P.la, function(v){ P.la=v; majCalculs(); }, "number");
  champ(r,"Hauteur sous plafond (m)", P.hsp, function(v){ P.hsp=v; majCalculs(); });
  var s=surfacePiece(P);
  if(s!==null && !txt(P.surf)) w.appendChild(el("p","mini","Surface calculée : "+fmt(s,1)+" m²"));
  if(nb(P.lg)===null || nb(P.la)===null || txt(P.surf))

function modeleRad(){
  for(var i=0;i<V.pieces.length;i++) if(V.pieces[i].rads.length) return V.pieces[i].rads[0];

/* --- calculs --- */
/* Coefficient G — modele reconstitue par mesures successives dans Projipack (aout 2026).
   Valide en croise : le point de la cartographie (1985, murs bruts, toit et fenetres 2000-2010)
   donne 0,98 pour 0,99 affiche par le logiciel. */
var G_ANNEE = [[1950,2.00],[1970,1.80],[1980,1.32],[1985,1.25],[1990,1.18],
               [2000,0.92],[2006,0.68],[2010,0.62],[2013,0.58],[2020,0.48]];
function gBase(an){
  if(an===null||isNaN(an)) return null;
  if(an<=G_ANNEE[0][0]) return G_ANNEE[0][1];
  var n=G_ANNEE.length;
  if(an>=G_ANNEE[n-1][0]) return G_ANNEE[n-1][1];
  for(var i=0;i<n-1;i++){
    var a=G_ANNEE[i], b=G_ANNEE[i+1];
    if(an>=a[0] && an<=b[0]) return a[1] + (b[1]-a[1])*(an-a[0])/(b[0]-a[0]);
  }
  return null;
}
var D_PAROI = {
  murs:{"Avant 1988":0.04,"Entre 1989 et 2000":0.04,"Entre 2000 et 2010":0.09,"Apres 2010":0.12},
  toit:{"Avant 1988":0.05,"Entre 1989 et 2000":0.05,"Entre 2000 et 2010":0.11,"Apres 2010":0.15},
  fen: {"Avant 1988":0.06,"Entre 1989 et 2000":0.06,"Entre 2000 et 2010":0.14,"Apres 2010":0.17}
};
function dParoi(quoi, val){
  var t=D_PAROI[quoi], v=String(val||"").replace(/\u00e8/g,"e").replace(/\u00e9/g,"e");
  return t[v]!==undefined ? t[v] : 0;
}
function coefG(){
  var manuel=nb(V.maison.g);
  if(manuel!==null) return manuel;
  var g0=gBase(nb(V.client.annee));
  if(g0===null) return null;
  var d = dParoi("murs",V.maison.isol_murs) + dParoi("toit",V.maison.isol_toit) + dParoi("fen",V.maison.isol_fen);
  var n = (dParoi("murs",V.maison.isol_murs)?1:0) + (dParoi("toit",V.maison.isol_toit)?1:0) + (dParoi("fen",V.maison.isol_fen)?1:0);
  var C = n>=3 ? 1.18 : (n===2 ? 1.09 : 1.00);
  var f = Math.max(0, g0 - 0.69) / 0.5625;
  var g = g0 - C * f * d;
  return Math.round(g*100)/100;
}
function tBase(){ var v=nb(V.maison.tbase); return v===null ? -15 : v; }
function tConfort(){ var v=nb(V.maison.tconfort); return v===null ? 20 : v; }

/* --- note de dimensionnement : grille a 7 crans du gabarit MaPrime Facile --- */
var CRANS_NDD = [[0.4,"RE 2020"],[0.6,"RT 2012"],[0.65,"Bien isol\u00e9 \u2014 RT 2005"],
                 [0.8,"Isol\u00e9 \u2014 RT 2000"],[1,"Moyennement isol\u00e9"],[1.4,"Peu isol\u00e9"],[2,"Pas isol\u00e9"]];
var G_MURS   = {"10 cm et plus":0.65,"5 cm":1,"Non isoles":1.4};
var G_TOIT   = {"20 cm et plus":0.65,"10 cm":0.8,"6 cm":1,"Non isolees":2};
var G_PLANCH = {"10 cm et plus":0.65,"3 cm":0.8,"Non isole":2,"Sur terre-plein":0};
var G_VITRE  = {"Triple":0.65,"Double de moins de 15 ans":0.65,"Double de plus de 15 ans":1,"Simple":2};
function sansAccent(v){ return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function cranNDD(){
  var force=nb(V.aides.g_force);
  var M=V.maison, manque=[], vals=[], det=[];
  function pousse(lib, table, val){
    var k=sansAccent(val), t={};
    for(var x in table) if(table.hasOwnProperty(x)) t[sansAccent(x)]=table[x];
    if(!k || t[k]===undefined){ manque.push(lib); return; }
    if(t[k]>0){ vals.push(t[k]); det.push(lib+" : "+val); }
    else det.push(lib+" : "+val+" (hors grille)");
  }
  pousse("Murs", G_MURS, M.mur_cm);
  pousse("Combles", G_TOIT, M.toit_cm);
  pousse("Plancher bas", G_PLANCH, M.plancher_cm);
  pousse("Fenetres", G_VITRE, M.vitrage);
  var an=nb(V.client.annee);
  if(an!==null && an>=2022) vals.push(0.4);
  else if(an!==null && an>=2013) vals.push(0.6);
  var g = vals.length ? Math.max.apply(null, vals) : null;
  if(force!==null) g=force;
  var lib="";
  for(var i=0;i<CRANS_NDD.length;i++) if(CRANS_NDD[i][0]===g) lib=CRANS_NDD[i][1];
  return {g:g, libelle:lib, manque:manque, detail:det, force:force!==null};
}
function surfacePac(){
  var m=nb(V.aides.surf_pac);
  if(m!==null) return {s:m, manuel:true, n:0};
  var s=0, n=0;
  V.pieces.forEach(function(P){
    if(sansAccent(P.circuit)==="Non chauffee par la PAC") return;
    var sp=surfacePiece(P);
    if(sp===null) return;
    if(!P.circuit){
      var actif=false;
      P.rads.forEach(function(R){ if(R.type && sansAccent(R.sort)!=="Depose") actif=true; });
      if(!actif) return;
    }
    s+=sp; n++;
  });
  return {s:s||null, manuel:false, n:n};
}
function hspMoyenne(){
  var m=nb(V.aides.hsp_pac);
  if(m!==null) return m;
  var t=0, s=0;
  V.pieces.forEach(function(P){
    var sp=surfacePiece(P), h=nb(P.hsp);
    if(sp===null||h===null) return;
    t+=sp*h; s+=sp;
  });
  return s ? Math.round(t/s*100)/100 : null;
}
function ndd(){
  var c=cranNDD(), sp=surfacePac(), h=hspMoyenne();
  var vol = (sp.s!==null && h!==null) ? sp.s*h : null;
  var dt = 19 - tBase();
  var p = (c.g!==null && vol!==null) ? c.g*vol*dt/1000 : null;
  var pac = nb(V.aides.pac_puissance);
  var r = {cran:c, surface:sp.s, hsp:h, volume:vol, dt:dt, p:p,
           min: p!==null ? p*0.6 : null, max: p!==null ? p*1.3 : null,
           dtuMin: p!==null ? p*0.7 : null, dtuMax: p!==null ? p : null,
           pac:pac, taux:null, verdict:"", classe:""};
  if(p && pac!==null){
    r.taux = pac/p*100;
    if(r.taux<60){ r.verdict="Sous-dimensionnee : le dossier sera refuse"; r.classe="mal"; }
    else if(r.taux>130){ r.verdict="Sur-dimensionnee : le dossier sera refuse"; r.classe="mal"; }
    else if(r.taux>100){ r.verdict="Conforme a la note ("+fmt(r.taux)+" %) mais au-dessus du DTU 65.16, qui plafonne a 100 %"; r.classe="attention"; }
    else if(r.taux<70){ r.verdict="Conforme a la note ("+fmt(r.taux)+" %) mais sous le DTU 65.16, qui demande 70 % minimum"; r.classe="attention"; }
    else { r.verdict="Conforme note et DTU ("+fmt(r.taux)+" %)"; r.classe="ok"; }
  }
  return r;
}

/* --- vase d'expansion, NF EN 12828 --- */
var DILAT = [[40,0.0079],[50,0.0121],[60,0.0171],[70,0.0227],[80,0.0290],[90,0.0359]];
var VASES = [8,12,18,24,35,50,80,100,140,200,300];
function vaseExp(){
  var W=V.maison.vase, V0=volumeEau().total;
  var hs=nb(W.hstat), td=nb(W.tdepart), pt=nb(W.tarage), vi=nb(W.integre);
  if(V0<=0 || hs===null || td===null || pt===null) return null;
  var e=DILAT[DILAT.length-1][1];
  for(var i=0;i<DILAT.length;i++){ if(td<=DILAT[i][0]){ e=DILAT[i][1]; break; } }
  var reserve=Math.max(3, V0*0.005);
  var Vu=V0*e+reserve;
  var Pi=Math.round((hs/10+0.3)*10)/10;
  var Pf=Math.round((pt-0.5)*10)/10;
  if(Pf<=Pi) return {erreur:"Tarage de soupape trop bas pour cette hauteur statique"};
  var Vn=Vu*(Pf+1)/(Pf-Pi);
  var manque = vi!==null ? Math.max(0, Vn-vi) : null;
  var taille=VASES[VASES.length-1];
  for(var j=0;j<VASES.length;j++){ if((manque===null?Vn:manque)<=VASES[j]){ taille=VASES[j]; break; } }
  return {eau:V0, e:e, Vu:Vu, Pi:Pi, Pf:Pf, Vn:Vn, integre:vi, manque:manque,
          taille:taille, suffit: manque!==null && manque<=0,
          limite: manque!==null && manque>0 && manque<=2};
}
function gEstime(){ return nb(V.maison.g)===null; }
function ratioFroid(){
  var an=nb(V.client.annee);
  if(an===null) return 40;
  if(an>=2012) return 30;
  if(an>=2005) return 35;
  return 40;
}
function calcPiece(P){
  var s=surfacePiece(P), h=nb(P.hsp);
  if(s===null||h===null) return {vol:0};
  var vol=s*h, G=coefG();
  if(G===null) return {vol:vol};
  var dt=G*vol*(tConfort()-tBase());
  return {vol:vol, dt:dt, chaud:1.2*dt, froid:ratioFroid()*vol, debit:vol*5};
}
function totaux(){
  var t={vol:0,dt:0,chaud:0,froid:0,debit:0};
  V.pieces.forEach(function(P){ var c=calcPiece(P); if(!c.vol) return;
    t.vol+=c.vol; t.dt+=c.dt; t.chaud+=c.chaud; t.froid+=c.froid; t.debit+=c.debit; });
  return t;
}
function totauxClim(){
  var n=0, l=0;
  V.pieces.forEach(function(P){
    if(P.clim && P.clim.traite==="Oui"){ n++; var x=nb(P.clim.liaison); if(x!==null) l+=x; }
  });
  return {nbui:n, liaison:l};
}
var ACIER_T = {"10":2.5,"11":3.5,"20":4.5,"21":5.5,"22":7,"33":10.5};
function contenanceRad(R,P){
  if(!R.type) return 0;
  var n=nb(R.nb)||1, t=sansAccent(R.type);
  if(t.indexOf("Plancher")===0){ var sp=P?surfacePiece(P):null; return sp!==null ? 0.9*sp : 8*n; }
  if(t.indexOf("Seche")===0) return 4*n;
  if(t.indexOf("Ventilo")===0) return 2*n;
  var base=6;
  if(t==="Fonte") base=12;
  else if(t==="Acier tubulaire") base=8;
  else if(t==="Alu") base=3;
  else if(t.indexOf("Acier")===0) base = ACIER_T[String(R.modele||"").replace(/[^0-9]/g,"")] || 6;
  var lg=nb(R.lg), h=nb(R.h);
  if(lg===null) return base*n;
  var fh = h!==null ? (h/60) : 1;
  return base*(lg/100)*fh*n;
}
function volumeEau(){
  var rad=0, nbRad=0;
  V.pieces.forEach(function(P){
    P.rads.forEach(function(R){ rad+=contenanceRad(R,P); nbRad+=(nb(R.nb)||1); });
  });
  var reseau = 10 + nbRad*1.5;
  var gen = aLotPac() ? 5 : 3;
  return {total: rad+reseau+gen, rad:rad, nbRad:nbRad, reseau:reseau, gen:gen,
    detail: fmt(rad)+" L d'émetteurs ("+nbRad+") + "+fmt(reseau)+" L de réseau + "+gen+" L de générateur"};
}

var OPTS_CRAN=["Automatique","0,4 RE 2020","0,6 RT 2012","0,65 RT 2005","0,8 RT 2000","1 moyen","1,4 peu isol\u00e9","2 pas isol\u00e9"];
function cranCourant(g){
  if(g===""||g===null||g===undefined) return "Automatique";
  for(var i=1;i<OPTS_CRAN.length;i++)
    if(OPTS_CRAN[i].split(" ")[0].replace(",",".")===String(g)) return OPTS_CRAN[i];
  return "Automatique";
}

  l("Coefficient G", N.cran.g===null ? "" : fmt(N.cran.g,2));

    });

  var sh=nb(V.maison.surface), sp=0, npc=0;

  if(sh!==null && npc>=2 && sp>0){

        "Surface habitable saisie : "+fmt(sh,0)+" m². Somme des "+npc+" pièces relevées : "+fmt(sp,1)+" m²"+
        " ("+(sp>sh?"+":"")+fmt((sp-sh)/sh*100,0)+" %).<br>"+
        (sp<sh ? "Il manque probablement des pièces au relevé : le dimensionnement sera sous-évalué."
               : "Vérifie les cotes, ou la surface habitable annoncée.")+"</span>";
      a.appendChild(wc);

  if(aLotPac()){

        "<br><span class='mini'>À partir du 1er septembre 2026, seules les PAC agréées par l'ADEME ouvrent droit à la prime bonifiée. "+
        "Ce qui compte, c'est la <b>date de signature du devis</b> : un devis signé avant le 31 août échappe à l'obligation, quel que soit le modèle posé. "+
        "Au-delà, il faut un modèle de la liste bonus-pac.ademe.fr et son numéro d'agrément sur la facture et l'attestation sur l'honneur.</span>";

        "<br><span class='mini'>Depuis le 1er septembre 2026, le modèle doit figurer sur la liste bonus-pac.ademe.fr "+
        "et son numéro d'agrément doit apparaître sur la facture et sur l'attestation sur l'honneur. "+
        "Vérifie la référence avant de chiffrer : sur une air/eau, la bonification représente plusieurs milliers d'euros.</span>";
    }
    a.appendChild(wa);
  }
  var obl=postesObligatoires();
  if(obl.length){

  a.appendChild(el("h3",null,"Où en est cette fiche ?"));

  a.appendChild(br);
  var b=el("button","btn p large","✓ Fiche terminée — envoyer pour chiffrage"); b.type="button";
  b.onclick=function(){ envoyer("finale"); };
  a.appendChild(b);

  var bb=el("button","btn p large","📋 Copier le brief de chiffrage"); bb.type="button";
  bb.onclick=function(){ copier(briefChiffrage(),"Brief de chiffrage"); };

  b2.onclick=function(){ copier(JSON.stringify(payload("finale"),null,1),"Données envoyées"); };

/* Reprise d'une fiche : fichier ou texte colle. */
function ouvrirReprise(){
  var dt=$("#dlgTexte"), ct=$("#corpsTexte");
  dt.querySelector(".dlg-tete").textContent="Reprendre une fiche";
  ct.innerHTML="";
  ct.appendChild(el("p","mini","Ouvre le fichier enregistré depuis l'autre appareil, ou colle le code de la fiche. Si la fiche existe déjà ici, la plus récente des deux est gardée."));
  var bf=el("button","btn p large","📂 Ouvrir un fichier de fiche"); bf.type="button";
  bf.onclick=function(){
    var i=document.createElement("input"); i.type="file"; i.accept=".json,application/json,text/plain";
    i.onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      var l=new FileReader();
      l.onload=function(){
        var r=importerFiche(l.result);
        if(!r.ok){ toast(r.m,"mal"); return; }
        dt.close(); aller("client");
        toast((r.remplace?"Fiche mise à jour : ":"Fiche reprise : ")+r.nom,"ok");
      };
      l.onerror=function(){ toast("Fichier illisible","mal"); };
      l.readAsText(f);
    };
    i.click();
  };
  ct.appendChild(bf);
  var ta=el("textarea"); ta.placeholder="… ou colle ici le code de la fiche"; ta.style.minHeight="150px";
  ct.appendChild(ta);
  var v=el("button","btn large","Reprendre depuis le code"); v.type="button";
  v.onclick=function(){
    var r=importerFiche(ta.value);
    if(!r.ok){ toast(r.m,"mal"); return; }
    dt.close(); aller("client");
    toast((r.remplace?"Fiche mise à jour : ":"Fiche reprise : ")+r.nom,"ok");
  };
  ct.appendChild(v);
  var an=el("button","btn mini large","Annuler"); an.type="button";
  an.onclick=function(){ dt.close(); };
  ct.appendChild(an);
  dt.showModal();
}

  V.lots.forEach(function(L){ cles[L.cle]=true; if(L.nom) cles[L.nom.toLowerCase()]=true; });
  if(cles["gaz"]) o.push("Certificat de conformité gaz",

                         "Traitement de l'eau du circuit (Sentinel X100)",
                         "Dépose et évacuation de l'ancienne chaudière");
  if(cles["pac"]) o.push("Traitement de l'eau", "Filtre à boue sur retour", "Disconnecteur de remplissage",

                         "Entrées d'air aux menuiseries des pièces sèches",

  });

  if(fac) o.push("Goulotte extérieure, fixations et protection UV — "+fmt(fac,1)+" m en façade relevés au croquis");

  tousCroquis().forEach(function(x){ crResume(x.C).percements.forEach(function(d){ perc.push(d); }); });

}

var PHOTO_MAX=1280, PHOTO_QUAL=0.62, PHOTO_MAXI=12;
function reduireImage(fichier, fn){
  var l=new FileReader();
  l.onload=function(){
    var im=new Image();
    im.onload=function(){
      var e=Math.min(1, PHOTO_MAX/Math.max(im.width,im.height));
      var c=document.createElement("canvas");
      c.width=Math.round(im.width*e); c.height=Math.round(im.height*e);
      var x=c.getContext("2d");
      x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
      x.drawImage(im,0,0,c.width,c.height);
      fn(c.toDataURL("image/jpeg",PHOTO_QUAL));
    };
    im.onerror=function(){ fn(null); };
    im.src=l.result;
  };
  l.onerror=function(){ fn(null); };
  l.readAsDataURL(fichier);
}
function prendrePhoto(cible, etiquette, qk){
  var i=document.createElement("input");
  i.type="file"; i.accept="image/*";
  i.onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    cible.photos=cible.photos||[];
    if(cible.photos.length>=PHOTO_MAXI){ toast(PHOTO_MAXI+" photos maximum ici","att"); return; }
    reduireImage(f,function(data){
      if(!data){ toast("Image illisible","mal"); return; }
      cible.photos.push({id:idUnique("ph"), et:etiquette||"Autre", q:qk||null, data:data, t:Date.now()});
      if(!sauverTout()){
        cible.photos.pop();
        toast("Mémoire pleine — envoie une fiche avant d'ajouter des photos","mal");
        return;
      }
      rendre();
    });
  };
  i.click();
}

function postMake(url,obj){
  return fetch(url,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:"payload="+encodeURIComponent(JSON.stringify(obj))});
}
function fileLire(){ return lire(CLE_FILE,[]); }
function fileEcrire(f){ ecrire(CLE_FILE,f); }
function fileAjouter(p){ var f=fileLire(); f.push({t:Date.now(), p:p}); fileEcrire(f); }

var envoiEnCours=false;
function viderFile(manuel){
  if(envoiEnCours) return;
  if(navigator.onLine===false){ if(manuel) toast("Pas de réseau — gardé en attente","att"); return; }
  var f=fileLire();
  if(!f.length){ if(manuel) toast("Rien en attente"); return; }
  if(!cfg.webhook){ if(manuel) toast("Adresse d'envoi non renseignée","mal"); return; }
  envoiEnCours=true;
  var reste=f.slice(), envoyes=0;
  function suivant(){
    if(!reste.length){
      envoiEnCours=false; fileEcrire([]);
      if(envoyes){ toast(envoyes+" envoi"+(envoyes>1?"s":"")+" effectué"+(envoyes>1?"s":""),"ok"); }
      return;
    }
    var it=reste[0];
    postMake(cfg.webhook,it.p)
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(){ reste.shift(); envoyes++; fileEcrire(reste.slice()); suivant(); })
      .catch(function(){
        envoiEnCours=false; fileEcrire(reste.slice());
        if(manuel) toast(navigator.onLine===false ? "Pas de réseau — gardé en attente"
          : "Make n'a pas répondu — gardé en attente, rien n'est perdu","mal");
      });
  }
  suivant();
}
function envoyer(statut){
  /* Rien n'est obligatoire : c'est sa fiche, il l'envoie comme il veut.
     On signale, on n'interdit pas. */
  sauverTout();
  if(!cfg.webhook){
    fileAjouter(payload(statut));
    V.statut = (statut==="finale") ? "envoyee" : "brouillon";
    sauverTout();
    toast("Pas d'adresse d'envoi dans les réglages — la fiche est gardée et partira dès qu'elle sera renseignée","att");
    return;
  }
  fileAjouter(payload(statut));
  envoyerPhotos(statut);
  V.statut = (statut==="finale") ? "envoyee" : "brouillon";
  V.envoye = Date.now();
  sauverTout();
  toast(statut==="finale" ? "Fiche envoyée pour chiffrage" : "Brouillon envoyé — tu le retrouveras au bureau");
  viderFile(true);
  if(statut==="finale") setTimeout(function(){ aller("accueil"); }, 900);
}

function importerFiche(texte){
  var o;
  try{ o=JSON.parse(String(texte).trim()); }
  catch(e){ return {ok:false, m:"Ce texte n'est pas une fiche exportée"}; }
  var f = (o && o.fiche) ? o.fiche : o;
  if(!f || !f.id || !f.client) return {ok:false, m:"Ce fichier ne contient pas de fiche"};
  fusionner(f, ficheVierge());
  f.id = f.id;
  var remplace=false;
  for(var i=0;i<fiches.length;i++){
    if(fiches[i].id===f.id){
      if((fiches[i].maj||0) > (f.maj||0)){
        return {ok:false, m:"La fiche déjà sur cet appareil est plus récente — importe-la dans l'autre sens"};
      }
      fiches[i]=f; remplace=true; break;
    }
  }
  if(!remplace) fiches.push(f);
  V=f;
  if(!ecrire(CLE_FICHES,fiches)) return {ok:false, m:"Mémoire pleine — envoie une fiche avant d'importer"};
  ecrire(CLE_COUR, V.id);

/* --- géométrie --- */
/* Une piece n'est pas toujours un rectangle : une piece en L, un pan coupe,
   un sous-pente. On garde le rectangle par defaut et on passe en polygone au besoin. */
function polyDe(E){
  if(E.poly && E.poly.length>=6) return E.poly;
  return [E.x,E.y, E.x+E.w,E.y, E.x+E.w,E.y+E.h, E.x,E.y+E.h];
}
function airePoly(pts){
  var a=0;
  for(var i=0;i<pts.length;i+=2){
    var j=(i+2)%pts.length;
    a += pts[i]*pts[j+1] - pts[j]*pts[i+1];
  }
  return Math.abs(a)/2;
}
function centrePoly(pts){
  var sx=0, sy=0, n=pts.length/2;
  for(var i=0;i<pts.length;i+=2){ sx+=pts[i]; sy+=pts[i+1]; }
  return {x:sx/n, y:sy/n};
}
function boitePoly(pts){
  var x1=pts[0], y1=pts[1], x2=pts[0], y2=pts[1];
  for(var i=2;i<pts.length;i+=2){
    x1=Math.min(x1,pts[i]); x2=Math.max(x2,pts[i]);
    y1=Math.min(y1,pts[i+1]); y2=Math.max(y2,pts[i+1]);
  }
  return {x:x1, y:y1, w:x2-x1, h:y2-y1};
}
function dansPoly(pts, x, y){
  var dedans=false;
  for(var i=0, j=pts.length-2; i<pts.length; j=i, i+=2){
    var xi=pts[i], yi=pts[i+1], xj=pts[j], yj=pts[j+1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) dedans=!dedans;
  }
  return dedans;
}
function distPoly(pts, x, y){
  var d=9;
  for(var i=0;i<pts.length;i+=2){
    var j=(i+2)%pts.length;
    d=Math.min(d, distPointSeg(x,y,pts[i],pts[i+1],pts[j],pts[j+1]));
  }
  return d;
}

function distPointSeg(px,py,x1,y1,x2,y2){

  C.el.forEach(function(E){
    if(E.t!=="sym" || nivDe(E)!==niv) return;
    var d=Math.sqrt((x-E.x)*(x-E.x)+(y-E.y)*(y-E.y));

/* accrochage aux extremites deja tracees : c'est ce qui rend un plan propre */

    if(nivDe(E)!==niv) return;

    if(E.t==="main"||E.t==="liaison"){

      cands.push([E.p[E.p.length-2],E.p[E.p.length-1]]);

/* magnetisme : cale sur l'horizontale, la verticale ou 45 degres */

    s+=Math.sqrt(Math.pow(E.p[i+2]-E.p[i],2)+Math.pow(E.p[i+3]-E.p[i+1],2));

function boutsDe(E){
  if(E.t==="cote"||E.t==="echelle") return [E.x1,E.y1,E.x2,E.y2];
  if(E.t==="main" && E.p && E.p.length>=4) return [E.p[0],E.p[1],E.p[2],E.p[3]];
  return null;
}
function r5(v){ return Math.round(v*100000)/100000; }
function poserBouts(E, x1,y1,x2,y2){
  if(E.t==="cote"||E.t==="echelle"){ E.x1=r5(x1); E.y1=r5(y1); E.x2=r5(x2); E.y2=r5(y2); return; }

  var d=Math.sqrt(dx*dx+dy*dy);

    C.ech={px:d, m:m};
    return true;
  }

/* Une liaison a une longueur au sol et des montees/descentes le long des murs.

function vertLiaison(E){

  return v;
}

/* Sommet le plus proche, tous polylignes confondues : c'est ce qu'on attrape pour tirer. */

  return E.p || null;

function sommetSous(C,x,y,seuil){

  }
  E.p.splice((k+1)*2, 0, r3(x), r3(y));
  if(E.dz){
    while(E.dz.length < E.p.length/2 - 1) E.dz.push(0);
    E.dz.splice(k+1, 0, 0);
  }
  if(E.dn){

    E.dn.splice(k+1, 0, 0);

  E.p.splice(k*2, 2);
  if(E.dz) E.dz.splice(k, 1);

/* Les modes de passage : ce qui decide du cheminement et des montees. */
var PASSAGES = [
  {k:"combles", l:"Par les combles ou le faux plafond", court:"Combles",
   aide:"On monte au plafond, on traverse en direct, on redescend le long du mur.",
   direct:true,  depart:1, arrivee:-1},
  {k:"goulotte", l:"En apparent, sous goulotte", court:"Goulotte",
   aide:"On longe les murs à angle droit, et on descend vers le groupe.",
   direct:false, depart:0, arrivee:-0.76},
  {k:"encastre", l:"Encastré dans les murs et le sol", court:"Encastré",
   aide:"On descend au sol, on longe, on remonte au point de raccordement.",
   direct:false, depart:-0.8, arrivee:0.12},
  {k:"vs", l:"Par le vide sanitaire ou la cave", court:"Vide sanitaire",
   aide:"On descend sous le plancher, on traverse en direct, on remonte.",
   direct:true,  depart:-1.12, arrivee:1.12},
  {k:"facade", l:"En façade, à l'extérieur", court:"Façade",
   aide:"On sort du bâti et on longe la façade : goulotte extérieure, fixations, protection UV.",
   direct:false, depart:0, arrivee:-0.76}

function passageDef(k){
  for(var i=0;i<PASSAGES.length;i++) if(PASSAGES[i].k===k) return PASSAGES[i];
  return PASSAGES[0];

/* distance au bord le plus proche d'une piece : sert a savoir si on longe un mur */
function distBordPiece(C,x,y){
  var d=9, niv=C.niv===undefined?1:C.niv;
  C.el.forEach(function(E){
    if(E.t!=="piece" || nivDe(E)!==niv) return;
    var b=[[E.x,E.y,E.x+E.w,E.y],[E.x+E.w,E.y,E.x+E.w,E.y+E.h],
           [E.x+E.w,E.y+E.h,E.x,E.y+E.h],[E.x,E.y+E.h,E.x,E.y]];

function scoreLonge(C, pts){
  var n=0, tot=0;

    for(var t=0;t<=10;t++){
      var x=pts[i]+(pts[i+2]-pts[i])*t/10, y=pts[i+1]+(pts[i+3]-pts[i+1])*t/10;

function cheminer(C, ax, ay, bx, by, mode){

    var L2=[ax,ay,ax,by,bx,by];

    if(Math.abs(bx-ax)<0.01 || Math.abs(by-ay)<0.01) pts=[ax,ay,bx,by];

/* --- rendu --- */
function crDessiner(C, ctx, W, H, fondImg, selection, vue){
  var z=(vue&&vue.z)||1, ox=(vue&&vue.ox)||0, oy=(vue&&vue.oy)||0;
  var niv=(vue&&vue.niv!==undefined)?vue.niv:(C.niv===undefined?1:C.niv);
  var tous=!!(vue&&vue.tous);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.scale(z,z); ctx.translate(-ox*W, -oy*W);
  if(fondImg){
    try{ ctx.globalAlpha=0.85; ctx.drawImage(fondImg,0,0,W,H); ctx.globalAlpha=1; }catch(e){}
  } else if(C.fond==="grille"){
    var pas=W/24;
    ctx.strokeStyle="#DCE6F0"; ctx.lineWidth=1;
    for(var gx=pas; gx<W; gx+=pas){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(var gy=pas; gy<H; gy+=pas){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    ctx.strokeStyle="#C2D2E2"; ctx.lineWidth=1.4;
    for(var mx=pas*4; mx<W; mx+=pas*4){ ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,H); ctx.stroke(); }
    for(var my=pas*4; my<H; my+=pas*4){ ctx.beginPath(); ctx.moveTo(0,my); ctx.lineTo(W,my); ctx.stroke(); }
  }
  ctx.lineCap="round"; ctx.lineJoin="round";
  var i;
  if(!tous){
    ctx.globalAlpha=0.22;
    for(i=0;i<C.el.length;i++)
      if(nivDe(C.el[i])===niv-1 && !multiNiveau(C.el[i])) crElement(C, ctx, W, C.el[i], false, niv);
    ctx.globalAlpha=1;
  }
  for(i=0;i<C.el.length;i++){
    var EL=C.el[i];
    var vu = tous || (EL.t==="liaison" ? traverseNiveau(EL, niv) : nivDe(EL)===niv);
    if(vu) crElement(C, ctx, W, EL, i===selection, niv);
  }
  ctx.restore();
  if(C.ech && C.ech.px) crBarreEchelle(C, ctx, W, H, z);
}
/* la reglette en bas a gauche : c'est ce qui rend le croquis lisible une fois imprime */
function crBarreEchelle(C, ctx, W, H, z){
  var mParPx = C.ech.m/(C.ech.px*W*z);
  var choix=[0.5,1,2,5,10,20], mVoulu=choix[1], px;
  for(var i=0;i<choix.length;i++){
    px=choix[i]/mParPx;
    if(px>=W*0.12 && px<=W*0.32){ mVoulu=choix[i]; break; }
    if(px>W*0.32){ mVoulu=choix[Math.max(0,i-1)]; break; }
    mVoulu=choix[i];
  }
  var lg=mVoulu/mParPx;
  if(!isFinite(lg) || lg<=0 || lg>W) return;
  var x0=W*0.022, y0=H-W*0.028;
  ctx.save();
  ctx.fillStyle="rgba(255,255,255,0.9)";
  ctx.fillRect(x0-W*0.012, y0-W*0.032, lg+W*0.024, W*0.05);
  ctx.strokeStyle="#0E1A26"; ctx.lineWidth=Math.max(1,W/700);
  ctx.beginPath();
  ctx.moveTo(x0, y0-W*0.008); ctx.lineTo(x0, y0);
  ctx.lineTo(x0+lg, y0); ctx.lineTo(x0+lg, y0-W*0.008);
  ctx.stroke();
  ctx.fillStyle="#0E1A26";
  ctx.fillRect(x0, y0-W*0.003, lg/2, W*0.003);
  ctx.font="600 "+(W/62)+"px 'Barlow Semi Condensed',Arial,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.fillText(fmt(mVoulu, mVoulu<1?1:0)+" m", x0+lg/2, y0-W*0.011);
  ctx.restore();
}
function crElement(C, ctx, W, E, sel, niv){
  var i;
  if(E.t==="main"){
    ctx.strokeStyle=E.c||"#0E1A26"; ctx.lineWidth=(E.e||3)*W/1000*2.2;
    ctx.beginPath(); ctx.moveTo(E.p[0]*W, E.p[1]*W);
    for(i=2;i<E.p.length;i+=2) ctx.lineTo(E.p[i]*W, E.p[i+1]*W);
    if(E.p.length===2) ctx.lineTo(E.p[0]*W+0.5, E.p[1]*W+0.5);
    ctx.stroke();
    if(E.droit && C.cotes!==false){
      var lm2=metres(C, longueurNorm({t:"cote", x1:E.p[0], y1:E.p[1], x2:E.p[2], y2:E.p[3]}));
      if(lm2!==null && lm2>0.05)
        crEtiquette(ctx, W, (E.p[0]+E.p[2])/2*W, (E.p[1]+E.p[3])/2*W, fmt(lm2,2)+" m", E.c||"#0E1A26");
    }
  } else if(E.t==="liaison"){
    var RD=resDef(E.res||"frigo");
    var alphaAvant=ctx.globalAlpha;
    ctx.lineWidth=W/1000*7;
    for(i=0;i+3<E.p.length;i+=2){
      var kseg=i/2, nk=nivSegment(E,kseg);
      var dehors = (niv!==undefined) && (nk!==niv);
      ctx.globalAlpha = dehors ? alphaAvant*0.28 : alphaAvant;
      var ps=passageSegment(E,kseg);
      ctx.strokeStyle = (ps==="facade") ? "#9A5B00" : RD.c;
      ctx.setLineDash(ps==="facade" ? [W/1000*18, W/1000*5, W/1000*4, W/1000*5]
                                    : [W/1000*RD.tirets[0], W/1000*RD.tirets[1]]);
      ctx.beginPath();
      ctx.moveTo(E.p[i]*W, E.p[i+1]*W);
      ctx.lineTo(E.p[i+2]*W, E.p[i+3]*W);
      ctx.stroke();
      if(ps && ps!==(E.passage||"")){
        crEtiquette(ctx, W, (E.p[i]+E.p[i+2])/2*W, (E.p[i+1]+E.p[i+3])/2*W,
                    passageDef(ps).court, ps==="facade"?"#9A5B00":RD.c, -W/30);
      }
    }
    ctx.setLineDash([]); ctx.globalAlpha=alphaAvant;
    for(i=0;i<E.p.length;i+=2) crPoint(ctx, E.p[i]*W, E.p[i+1]*W, sel?W/130:W/220, RD.c);
    if(sel) for(i=0;i<E.p.length;i+=2) crPoint(ctx, E.p[i]*W, E.p[i+1]*W, W/300, "#FFFFFF");
    if(multiNiveau(E)){
      for(i=0;i<E.dn.length;i++){
        if(!E.dn[i] || i*2+1>=E.p.length) continue;
        crNiveauMarque(ctx, W, E.p[i*2]*W, E.p[i*2+1]*W, E.dn[i], RD.c);
      }
    }
    if(E.dz){
      for(i=0;i<E.dz.length;i++){
        var dzv=nb(E.dz[i])||0;
        if(!dzv) continue;
        crFleche(ctx, W, E.p[i*2]*W, E.p[i*2+1]*W, dzv, RD.c);
      }
    }
    var LL=longueurLiaison(C,E);
    if(LL.total!==null){
      var lib = (txt(E.dim)? E.dim+" — ":"")+fmt(LL.total,1)+" m";
      if(LL.v) lib += LL.h===null ? " vertical" : " (dont "+fmt(LL.v,1)+" vert.)";
      var n2=E.p.length;
      var ex = n2>=4 ? (E.p[n2-4]+E.p[n2-2])/2 : E.p[0];
      var ey = n2>=4 ? (E.p[n2-3]+E.p[n2-1])/2 : E.p[1];
      crEtiquette(ctx, W, ex*W, ey*W, lib, RD.c, W/34);
    }
  } else if(E.t==="cote"||E.t==="echelle"){
    var col = E.t==="echelle" ? "#146B3A" : "#0D3B66";
    ctx.strokeStyle=col; ctx.lineWidth=W/1000*4;
    ctx.beginPath(); ctx.moveTo(E.x1*W,E.y1*W); ctx.lineTo(E.x2*W,E.y2*W); ctx.stroke();
    var ang=Math.atan2(E.y2-E.y1, E.x2-E.x1)+Math.PI/2, br=W/70;
    [[E.x1,E.y1],[E.x2,E.y2]].forEach(function(pt){
      ctx.beginPath();
      ctx.moveTo(pt[0]*W-Math.cos(ang)*br, pt[1]*W-Math.sin(ang)*br);
      ctx.lineTo(pt[0]*W+Math.cos(ang)*br, pt[1]*W+Math.sin(ang)*br);
      ctx.stroke();
    });
    var lm = E.m!==null && E.m!==undefined ? E.m : metres(C, longueurNorm(E));
    if(lm!==null && lm!==undefined)
      crEtiquette(ctx, W, (E.x1+E.x2)/2*W, (E.y1+E.y2)/2*W, fmt(lm,2)+" m", col);
  } else if(E.t==="piece"){
    var pts=polyDe(E), ctr=centrePoly(pts);
    ctx.strokeStyle=sel?"#A31D14":(E.deduit?"#9A5B00":"#3D5468");
    ctx.lineWidth=W/1000*(sel?7:5);
    ctx.fillStyle=E.deduit?"rgba(154,91,0,0.07)":"rgba(13,59,102,0.06)";
    if(E.deduit) ctx.setLineDash([W/1000*12, W/1000*7]);
    ctx.beginPath();
    ctx.moveTo(pts[0]*W, pts[1]*W);
    for(i=2;i<pts.length;i+=2) ctx.lineTo(pts[i]*W, pts[i+1]*W);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    if(sel && E.poly){
      for(i=0;i<pts.length;i+=2){
        crPoint(ctx, pts[i]*W, pts[i+1]*W, W/130, "#A31D14");
        crPoint(ctx, pts[i]*W, pts[i+1]*W, W/300, "#FFFFFF");
      }
    }
    ctx.fillStyle="#0E1A26";
    ctx.font="600 "+(W/42)+"px 'Barlow Semi Condensed',Arial,sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(E.nom||"", ctr.x*W, ctr.y*W - W/70);
    ctx.font=(W/58)+"px 'Barlow Semi Condensed',Arial,sans-serif";
    ctx.fillStyle="#3D5468";
    var inf=E.info;
    if(E.poly){
      var sm=surfacePoly(C,E);
      if(sm!==null) inf=fmt(sm,1)+" m²";
    }
    if(inf) ctx.fillText(inf, ctr.x*W, ctr.y*W + W/60);
  } else if(E.t==="texte"){
    ctx.fillStyle=E.c||"#0E1A26";
    ctx.font="600 "+(W/40)+"px 'Barlow Semi Condensed',Arial,sans-serif";
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText(E.txt||"", E.x*W, E.y*W);
  } else if(E.t==="sym"){
    crSymbole(ctx, W, E, sel);
  }
}
/* Marque du changement d'etage : un double chevron, pour le distinguer
   d'une simple montee le long d'un mur. */
function crNiveauMarque(ctx, W, x, y, dn, coul){
  var t=W/30, mont=dn>0;
  ctx.save();
  ctx.translate(x,y);
  ctx.strokeStyle=coul; ctx.lineWidth=W/1000*5.5;
  ctx.fillStyle="rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.arc(0,0,t*0.62,0,6.2832); ctx.fill(); ctx.stroke();
  ctx.lineWidth=W/1000*4.5;
  for(var j=0;j<2;j++){
    var oy=(j===0?-1:1)*t*0.16 + (mont? t*0.1 : -t*0.1);
    ctx.beginPath();
    ctx.moveTo(-t*0.26, oy + (mont? t*0.16 : -t*0.16));
    ctx.lineTo(0, oy - (mont? t*0.16 : -t*0.16));
    ctx.lineTo(t*0.26, oy + (mont? t*0.16 : -t*0.16));
    ctx.stroke();
  }
  ctx.restore();
}
function crFleche(ctx, W, x, y, dz, coul){
  var t=W/26, mont=dz>0, cc=coul||"#A31D14";
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle=cc; ctx.fillStyle=cc; ctx.lineWidth=W/1000*5;
  ctx.beginPath(); ctx.moveTo(0, mont? t*0.55 : -t*0.55); ctx.lineTo(0, mont? -t*0.55 : t*0.55); ctx.stroke();
  var py = mont ? -t*0.55 : t*0.55, sg = mont ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(0, py);
  ctx.lineTo(-t*0.26, py + sg*t*0.34);
  ctx.lineTo(t*0.26, py + sg*t*0.34);
  ctx.closePath(); ctx.fill();
  ctx.font="700 "+(W/52)+"px 'Barlow Semi Condensed',Arial,sans-serif";
  ctx.textAlign="left"; ctx.textBaseline="middle";
  var et=(mont?"+":"\u2212")+fmt(Math.abs(dz),1).replace(",",",")+" m";
  var lw=ctx.measureText(et).width+W/140;
  ctx.fillStyle="rgba(255,255,255,0.92)";
  ctx.fillRect(t*0.34, -W/62, lw, W/31);
  ctx.fillStyle=cc;
  ctx.fillText(et, t*0.34+W/280, 0);
  ctx.restore();
}
function crPoint(ctx,x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
function crEtiquette(ctx, W, x, y, t, c, dy){
  ctx.font="600 "+(W/48)+"px 'Barlow Semi Condensed',Arial,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  var lw=ctx.measureText(t).width+W/90, lh=W/32;
  if(x-lw/2 < 2) x=lw/2+2;
  if(x+lw/2 > W-2) x=W-lw/2-2;
  var oy=(dy===undefined? -W/60 : dy);
  ctx.fillStyle="rgba(255,255,255,0.92)";
  ctx.fillRect(x-lw/2, y-lh/2+oy, lw, lh);
  ctx.fillStyle=c; ctx.fillText(t, x, y+oy);
}
function crSymbole(ctx, W, E, sel){
  var d=symDef(E.s), t=(E.e||0.075)*W;
  var w=d.w*t, h=d.h*t;
  ctx.save();
  ctx.translate(E.x*W, E.y*W);
  ctx.rotate((E.r||0)*Math.PI/180);
  ctx.lineWidth=W/1000*4.5;
  ctx.strokeStyle=sel?"#A31D14":"#0E1A26";
  ctx.fillStyle="rgba(255,255,255,0.9)";
  if(d.f==="rond"){
    ctx.beginPath(); ctx.ellipse ? ctx.ellipse(0,0,w/2,h/2,0,0,6.2832) : ctx.arc(0,0,w/2,0,6.2832);
    ctx.fill(); ctx.stroke();
  } else if(d.f==="vanne"){
    ctx.beginPath(); ctx.moveTo(-w/2,-h/2); ctx.lineTo(0,0); ctx.lineTo(-w/2,h/2); ctx.closePath();
    ctx.moveTo(w/2,-h/2); ctx.lineTo(0,0); ctx.lineTo(w/2,h/2); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if(d.f==="perc"){
    ctx.beginPath(); ctx.arc(0,0,w/2,0,6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(w/2,0); ctx.moveTo(0,-h/2); ctx.lineTo(0,h/2); ctx.stroke();
  } else if(d.f==="porte"){
    ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(w/2,0); ctx.stroke();
    ctx.lineWidth=W/1000*3;
    ctx.beginPath(); ctx.arc(-w/2, 0, w, -Math.PI/2, 0); ctx.stroke();
    ctx.lineWidth=W/1000*5.5;
    ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(-w/2,-w); ctx.stroke();
  } else if(d.f==="fen"){
    ctx.fillStyle="#FFFFFF";
    ctx.beginPath(); ctx.rect(-w/2,-h/2,w,h); ctx.fill(); ctx.stroke();
    ctx.lineWidth=W/1000*3;
    ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(w/2,0); ctx.stroke();
  } else if(d.f==="nord"){
    ctx.beginPath(); ctx.moveTo(0,-h/2); ctx.lineTo(w/2,h/2); ctx.lineTo(0,h/5); ctx.lineTo(-w/2,h/2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    if(d.arrondi && ctx.arcTo){
      var r=Math.min(w,h)/4;
      ctx.beginPath();
      ctx.moveTo(-w/2+r,-h/2);
      ctx.arcTo(w/2,-h/2,w/2,h/2,r); ctx.arcTo(w/2,h/2,-w/2,h/2,r);
      ctx.arcTo(-w/2,h/2,-w/2,-h/2,r); ctx.arcTo(-w/2,-h/2,w/2,-h/2,r);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.rect(-w/2,-h/2,w,h); ctx.fill(); ctx.stroke();
    }
    if(d.barres){
      ctx.lineWidth=W/1000*3;
      var n=5, pas=w/(n+1);
      for(var i=1;i<=n;i++){
        ctx.beginPath(); ctx.moveTo(-w/2+pas*i,-h/2+h*0.12); ctx.lineTo(-w/2+pas*i,h/2-h*0.12); ctx.stroke();
      }
    }
    if(d.diag){
      ctx.lineWidth=W/1000*3;
      ctx.beginPath(); ctx.moveTo(-w/2,-h/2); ctx.lineTo(w/2,h/2); ctx.moveTo(w/2,-h/2); ctx.lineTo(-w/2,h/2); ctx.stroke();
    }
    if(d.deuxronds){
      ctx.lineWidth=W/1000*3;
      ctx.beginPath(); ctx.arc(-w/5,0,h/3.4,0,6.2832); ctx.stroke();
      ctx.beginPath(); ctx.arc(w/4,0,h/4.6,0,6.2832); ctx.stroke();
    }
    if(d.escalier){
      ctx.lineWidth=W/1000*3;
      for(var m=1;m<=5;m++){
        var my=-h/2+h/6*m;
        ctx.beginPath(); ctx.moveTo(-w/2,my); ctx.lineTo(w/2,my); ctx.stroke();
      }
    }
    if(d.peigne){
      ctx.lineWidth=W/1000*3;
      for(var j=1;j<=4;j++){
        var px=-w/2+w/5*j;
        ctx.beginPath(); ctx.moveTo(px,h/2); ctx.lineTo(px,h/2+h*0.8); ctx.stroke();
      }
    }
  }
  if(d.helice){
    ctx.lineWidth=W/1000*3;
    var cxh = d.f==="rond" ? 0 : w*0.27;
    var rr = d.f==="rond" ? Math.min(w,h)/3 : Math.min(w,h)/3.6;
    ctx.beginPath(); ctx.arc(cxh,0,rr,0,6.2832); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cxh-rr,0); ctx.lineTo(cxh+rr,0); ctx.stroke();
  }
  var lib = d.a;
  if(E.s==="perc" && txt(E.txt)) lib = "Ø"+E.txt;
  if(lib){
    ctx.fillStyle=sel?"#A31D14":"#0E1A26";
    ctx.font="700 "+(t*0.34)+"px 'Barlow Semi Condensed',Arial,sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(lib, (d.helice && d.f!=="rond") ? -w*0.27 : 0, d.f==="perc"?-h*0.85:0);
  }
  ctx.restore();
  if(txt(E.txt) && E.s!=="perc"){
    ctx.fillStyle="#3D5468";
    ctx.font=(W/58)+"px 'Barlow Semi Condensed',Arial,sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText(E.txt, E.x*W, E.y*W + h/2 + W/220);
  }
}

/* --- petit dialogue de saisie (confirm/prompt sont bloqués dans certains navigateurs) --- */
function demanderTexte(titre, aide, valeur, type, fn){
  var f=el("div","crdlg");

  var z=el("div","crdlgz");
  var ok=el("button","btn p","Valider"); ok.type="button";
  var no=el("button","btn","Annuler"); no.type="button";
  function fermer(){ if(f.parentNode) f.parentNode.removeChild(f); }
  ok.onclick=function(){ var v=i.value; fermer(); fn(v); };

function demanderCote(C, E, apres){
  var b=boutsDe(E);
  if(!b) return;
  var d=Math.sqrt(Math.pow(b[2]-b[0],2)+Math.pow(b[3]-b[1],2));
  var mes=metres(C,d);
  demanderTexte("Longueur de ce trait",
    C.ech ? "Mesuré à "+fmt(mes,2)+" m. Tape la cote réelle, le trait s'y ajuste."
          : "Aucune échelle pour l'instant : la cote que tu tapes ici la posera pour tout le croquis.",
    mes!==null ? String(Math.round(mes*100)/100) : "", "number", function(v){
      if(v===null){ if(apres) apres(); return; }
      var n=parseFloat(String(v).replace(",","."));
      if(!(n>0)){ if(apres) apres(); return; }
      var avaitEch=!!C.ech;
      if(ajusterLongueur(C, E, n)){
        toast(avaitEch ? "Trait ajusté à "+fmt(n,2)+" m" : "Échelle posée : ce trait vaut "+fmt(n,2)+" m","ok");
      }
      if(apres) apres();
    });
}
